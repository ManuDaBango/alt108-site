<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldOps — PMWT Inspection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EFE9;--sf:#fff;--ink:#1B222B;--soft:#5B6470;--line:#DAD5C6;--acc:#E2A63A;--pass:#2F7D4F;--pbg:#E7F2EA;--fail:#C1432E;--fbg:#FBEAE5;--navy:#12181F;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F0EFE9}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px 'IBM Plex Sans',sans-serif}
h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0}
button{font:inherit;cursor:pointer}
#app{display:flex;min-height:100%}
.rail{width:200px;min-width:200px;background:var(--navy);color:#dfe3e8;padding:18px 14px;position:sticky;top:0;height:100vh;align-self:flex-start}
.rail h1{font:700 18px 'Space Grotesk';color:#fff;margin:0 0 2px}.rail small{color:var(--acc);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.role{display:flex;background:#212B36;border-radius:5px;padding:3px;margin:16px 0}
.role button{flex:1;background:none;border:0;color:#aeb6c0;padding:7px 2px;border-radius:4px;font-size:12px}
.role button.on{background:var(--acc);color:#4A3510;font-weight:600}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#c6ccd3;padding:9px 10px;border-radius:4px}
.nav button.on{background:#293544;color:#fff;font-weight:600}
main{flex:1;padding:26px 32px 70px;max-width:1100px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:5px;padding:16px 18px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mono{font-family:ui-monospace,monospace;font-size:12px}.soft{color:var(--soft);font-size:12.5px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eee;color:var(--soft)}
.b-Scheduled{background:#EEEFF1}.b-InProgress{background:#FCEFDB;color:#95661A}.b-Submitted{background:#EAE6F7;color:#5D3FA8}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:8px 14px;border-radius:4px;font-weight:600}
.btn.s{background:none;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.35;cursor:not-allowed}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.pill{background:var(--sf);border:1.5px solid var(--line);border-radius:5px;padding:7px 12px;font-weight:500}
.pill.on{border-color:var(--ink);background:var(--ink);color:#fff}.pill.ok{border-color:var(--pass)}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--line);margin-bottom:6px}
th{background:#546672;color:#fff;font:600 12px 'IBM Plex Sans';text-align:left;padding:8px 10px}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;border:1px solid var(--line);border-radius:4px;padding:7px 8px;background:#fff;width:100%}
input[type=number]{width:62px}
.yn{display:flex;gap:6px}.yn button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:4px;padding:8px 0;font-weight:600;color:var(--soft);min-width:52px}
.yn .Y.on{background:var(--pbg);border-color:var(--pass);color:var(--pass)}.yn .N.on{background:var(--fbg);border-color:var(--fail);color:var(--fail)}
select.r-Defective{background:var(--fbg);border-color:var(--fail)}select.r-No\ issues{background:var(--pbg);border-color:var(--pass)}select.r-See\ Comments{background:#FCEFDB;border-color:var(--acc)}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:3px;margin-left:6px}.tnew{background:var(--pbg);color:var(--pass)}.trem{background:var(--fbg);color:var(--fail)}
tr.gone td{opacity:.45;text-decoration:line-through}tr.gone td:last-child{text-decoration:none;opacity:1}
h3.sec{margin:20px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.note{background:#FFF7E3;border:1px solid #EBD79B;border-radius:5px;padding:10px 12px;font-size:12.5px;margin:10px 0}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:3px;margin:0 4px 4px 0}.chip.Y{background:var(--pbg);color:var(--pass)}.chip.N{background:var(--fbg);color:var(--fail)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:5px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
#rep{background:#fff;border:1px solid var(--line);padding:32px 38px;max-width:800px;margin:0 auto}
#rep th{background:#546672}.orange{border-left:4px solid #F26522;padding-left:10px}
.condrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.condrow button{flex:1;min-width:110px;border:1.5px solid var(--line);background:#fff;border-radius:4px;padding:9px 4px;font-weight:600;color:var(--soft)}
.condrow button.bad.on{background:var(--fbg);border-color:var(--fail);color:var(--fail)}
.condrow button.good.on{background:var(--pbg);border-color:var(--pass);color:var(--pass)}
@media print{.rail,.no-print{display:none!important}main{padding:0}#rep{border:0;padding:0}body{background:#fff}}
@media (max-width:820px){.rail{position:static;height:auto;width:100%}#app{flex-direction:column}main{padding:16px}}
</style></head><body>
<div id="app"><nav class="rail"><small id="companyName">Your Company Name</small><h1>FieldOps</h1>
<div class="role"><button id="rt" class="on" onclick="setRole('tech')">Technician</button><button id="ra" onclick="setRole('admin')">Admin</button></div>
<div class="nav" id="nav"></div><p class="soft" style="color:#7C8794;margin-top:24px">Demo · synthetic data<br>PMWT module v0.4<br><span id="src"></span></p></nav>
<main id="v"></main></div><div class="toast" id="toast"></div>
<script>
/* Setup: WEBHOOK receives submitted inspections (n8n -> Airtable). CATALOG_URL reads clients, sites,
   switchboards and register items live from Airtable through a read-only n8n workflow. If the catalog
   cannot be reached the page falls back to the built-in snapshot below, so the demo never breaks. */
const WEBHOOK="https://alt108.app.n8n.cloud/webhook/5f2e224a-f3de-4a3c-80bb-2c4cefebd8cd";
const CATALOG_URL="https://alt108.app.n8n.cloud/webhook/fieldops-catalog";
const CHECKS=["Switchboard interior clean and tidy","Covers on and no exposed conductors","Legend in place and up to date","Emergency lighting logbook in place and up to date","PES 24/7 contact details visible","All RCDs / MCBs in active position"];
const DEF="No action required";
const CAT={Light:["LED","Regular","OldSkool","Ceiling","Floodlight"],Fan:["Ceiling","Exhaust"],Alarm:["Motion","Smoke"]};
const RESULTS=["No issues","Defective","N/A","See Comments"];
const CONDS=["Very Poor","Poor","Satisfactory","Above Average"];
const COMPANY="Your Company Name"; // change this per demo — it's the electrical contractor's own name shown in the top-left
const TN={L:"Light",F:"Fan",A:"Alarm"};
// Offline snapshot of the Airtable data: [client, site, [[switchboard, location, "T:Sub:Qty,..."]]]
const SNAP_RAW=[
["GB Mines","Adelaide Tce",[["SB-AA1","Entrance","L:LED:2,L:LED:3,F:Ceiling:4,F:Exhaust:4,F:Exhaust:4,F:Exhaust:4"],["SB-AA2","Foyer","L:LED:2,L:LED:2,F:Ceiling:1"],["SB-AA3","Toilet","L:LED:3,L:LED:2,A:Motion:3,L:Floodlight:4,L:Floodlight:4"]]],
["GB Mines","Fremantle",[["SB-QN1","Ground","L:LED:1,L:LED:2,L:Ceiling:3,F:Exhaust:4,F:Ceiling:3,F:Exhaust:2"],["SB-QN2","Level 1","L:LED:1,L:LED:3,F:Ceiling:2"],["SB-QN3","Level 2","L:LED:1,L:LED:7,A:Smoke:3,L:Floodlight:4,L:Floodlight:2"]]],
["Palatino","Malaga",[["SB-AA4","Entrance","F:Exhaust:1,F:Exhaust:2,F:Ceiling:3,F:Exhaust:4"],["SB-AA5","Foyer","F:Exhaust:5,F:Exhaust:6,L:LED:7"],["SB-AA6","Ground","L:LED:8,F:Ceiling:1,L:LED:9,L:LED:2,A:Motion:3,F:Exhaust:4,L:Floodlight:3,L:LED:4,F:Ceiling:5"]]],
["Palatino","Mandurah",[["SB-QN5","Level 2","F:Ceiling:2,L:LED:8"],["SB-QN6","Toilet","A:Smoke:1,A:Smoke:7,L:Floodlight:4,L:Floodlight:1"]]],
["Doc’sPizza","Kewsdale",[["SB-QN4","Level 1","L:Ceiling:4,F:Exhaust:3,F:Ceiling:3,F:Exhaust:5,L:LED:1,L:LED:65"]]]];
// Technician-assigned area names for the original GB Mines boards (other boards use their location as the area name).
const AREA={"SB-AA1":["Reception","Reception","Reception Ceiling","Male Toilet","Female Toilet","Store Room"],
 "SB-AA2":["Foyer North","Foyer South","Foyer Ceiling"],
 "SB-AA3":["Toilet Vanity","Toilet Cubicles","Toilet Corridor","Outside East","Outside West"],
 "SB-QN1":["Ground Office 1","Ground Office 2","Ground Corridor","Ground Toilet Exhaust","Ground Lunchroom","Ground Store"],
 "SB-QN2":["Level 1 Office","Level 1 Meeting Rm","Level 1 Ceiling"],
 "SB-QN3":["Level 2 Office A","Level 2 Office B","Level 2 Landing","Roof North","Roof South"]};
const lbl=x=>x.type+" - "+x.sub;
const mkItems=(id,loc,str)=>str.split(",").map((t,i)=>{const[a,b,c]=t.split(":");return{type:TN[a],sub:b,qty:+c,line:i+1,area:(AREA[id]&&AREA[id][i])||loc}});
function snapCatalog(){const m={};SNAP_RAW.forEach(([c,s,bs])=>{(m[c]=m[c]||{name:c,sites:[]}).sites.push({name:s,boards:bs.map(([id,loc,str])=>({id,loc,items:mkItems(id,loc,str)}))})});
 return{clients:Object.values(m),technicians:["Jake Morrison","Gina Richie"],jobNumbers:[]}}
function fromLive(d){return{clients:d.clients.map(c=>({name:c.name,sites:c.sites.map(s=>({name:s.name,boards:s.boards.map(b=>({id:b.name,loc:b.loc||"",items:b.items.map(i=>({type:i.type,sub:i.sub,qty:i.qty,line:i.line,area:i.area||(AREA[b.name]&&AREA[b.name][i.line-1])||b.loc||""}))}))}))})),technicians:d.technicians||[],jobNumbers:d.jobNumbers||[]}}
let DB=snapCatalog(),SRC="snapshot";
const techs=()=>DB.technicians&&DB.technicians.length?DB.technicians:["Jake Morrison","Gina Richie"];
const findSite=(c,s)=>{const cl=DB.clients.find(x=>x.name===c);return cl&&cl.sites.find(x=>x.name===s)};
const allBoardIds=()=>[...new Set(S.reg.map(r=>r.sb))].sort();
function pushItems(reg,b){b.items.forEach(i=>reg.push({id:b.id+"-"+i.line,sb:b.id,type:i.type,sub:i.sub,qty:i.qty,line:i.line,area:i.area,active:true,added:"2025-01-01",removed:null,note:""}))}
function ensureReg(reg,b){if(!reg.some(r=>r.sb===b.id))pushItems(reg,b)}
function seedReg(){const R=[];snapCatalog().clients[0].sites[0].boards.forEach(b=>pushItems(R,b)); // GB Mines > Adelaide Tce history
 R.push({id:"SB-AA3-6",sb:"SB-AA3",type:"Light",sub:"Regular",qty:2,line:6,area:"Toilet Block Annex",active:false,added:"2025-01-01",removed:"2026-06-15",note:"Removed on 2026-06-15 (PMWT-2026-0121)"});return R}
function newJob(id,num,date,tech,client,site,reg){const st=findSite(client,site);const sbs=st.boards.map(b=>({id:b.id,loc:b.loc}));st.boards.forEach(b=>ensureReg(reg,b));
 return{id,num,date,tech,client,site,sbs,status:"Scheduled",lines:[],gm:{},bc:{},cond:null}}
function nextNum(){const n=Math.max(0,...S.jobs.map(j=>+j.num.slice(-4)),...DB.jobNumbers.map(x=>+String(x).slice(-4)||0));return"PMWT-2026-"+String(n+1).padStart(4,"0")}
function snap(job,reg){ // copy the CURRENT register into this visit's own result rows
 const ids=job.sbs.map(s=>s.id);
 job.lines=reg.filter(x=>ids.includes(x.sb)&&x.added<=job.date&&(!x.removed||x.removed>=job.date)&&(x.active||x.removed>=job.date&&job.status!=="Scheduled")).map(x=>({id:job.id+"-"+x.id,sb:x.sb,reg:x.id,type:x.type,sub:x.sub,qty:x.qty,line:x.line,area:x.area,r:null,c:"",added:false,removed:false}));
 job.gm={};job.sbs.forEach(s=>{job.gm[s.id]=CHECKS.map(()=>({r:null,c:DEF}))});job.bc={};job.cond=null}
function past(id,num,date,tech,gmFail,lineOv,cond){const sbs=[{id:"SB-AA1",loc:"Entrance"},{id:"SB-AA2",loc:"Foyer"},{id:"SB-AA3",loc:"Toilet"}];
 const j={id,num,date,tech,client:"GB Mines",site:"Adelaide Tce",sbs,status:"Report Issued",cond};
 const reg=seedReg();
 j.lines=reg.filter(x=>x.added<=date&&(!x.removed||x.removed>=date)).map(x=>({id:id+"-"+x.id,sb:x.sb,reg:x.id,type:x.type,sub:x.sub,qty:x.qty,line:x.line,area:x.area,r:"No issues",c:"",added:false,removed:false}));
 j.gm={};sbs.forEach(s=>{j.gm[s.id]=CHECKS.map(()=>({r:"Yes",c:DEF}))});j.bc={};
 gmFail.forEach(([sb,i,c])=>{j.gm[sb][i]={r:"No",c}});
 lineOv.forEach(([lid,r,c,rem])=>{const l=j.lines.find(x=>x.reg===lid);if(l){l.r=r;l.c=c;if(rem)l.removed=true}});return j}
function initial(){const reg=seedReg();
 const jobs=[past("j1","PMWT-2026-0088","2026-02-09","Jake Morrison",[["SB-AA2",2,"Legend outdated after board rework. Update required."]],[["SB-AA1-4","Defective","One exhaust fan not running."]],"Poor"),
  past("j2","PMWT-2026-0121","2026-06-15","Gina Richie",[["SB-AA3",3,"Logbook missing from board."]],[["SB-AA3-4","See Comments","1 of 4 floodlights flickering, monitor."],["SB-AA3-6","N/A","Fittings removed by client.",true]],"Satisfactory")];
 jobs[0].bc["SB-AA2"]="Board reworked in January; legend not yet updated.";
 jobs.push(newJob("j3","PMWT-2026-0153","2026-11-02","Jake Morrison","Palatino","Mandurah",reg));
 jobs.push(newJob("j4","PMWT-2026-0154","2026-11-03","Gina Richie","GB Mines","Adelaide Tce",reg));
 return{reg,jobs,role:"tech",view:"jobs",jid:null,sb:null,hsb:"SB-AA1",nn:0,nj:{client:"",site:""}}}
let S;try{S=JSON.parse(localStorage.getItem("fo4"))}catch(e){}if(!S)S=initial();
const save=()=>{try{localStorage.setItem("fo4",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);const J=id=>S.jobs.find(j=>j.id===id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)}
function go(view,o={}){Object.assign(S,{view},o);render()}
function setRole(r){S.role=r;S.view=r==="tech"?"jobs":"admin";render()}
const lines=(j,sb)=>j.lines.filter(l=>l.sb===sb).sort((a,b)=>a.line-b.line);
const boardDone=(j,sb)=>j.gm[sb].every(g=>g.r&&(g.r==="Yes"||g.c.trim()))&&lines(j,sb).every(l=>l.removed||(l.r&&(l.r==="No issues"||l.r==="N/A"||l.c.trim())));
const progress=j=>j.sbs.filter(s=>boardDone(j,s.id)).length;

/* ---------- Technician ---------- */
function vJobs(){let h=`<h2>My jobs</h2><p class="soft">Bookings created and allocated by the office.</p>`;
 S.jobs.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(j=>{
 h+=`<div class="card row sp"><div><div class="mono">${j.num}</div><h3>${esc(j.client)} — ${esc(j.site)}</h3><div class="soft">👷 ${j.tech} · 📅 ${j.date} · ${j.sbs.length} switchboard${j.sbs.length===1?"":"s"} (${j.sbs.map(s=>s.id).join(", ")})</div></div>
 <div class="row"><span class="badge b-${j.status.replace(/ /g,"")}">${j.status}</span>${j.status==="Scheduled"?`<button class="btn" onclick="startJob('${j.id}')">Start inspection</button>`:j.status==="In Progress"?`<button class="btn" onclick="go('form',{jid:'${j.id}',sb:'${j.sbs[0].id}'})">Continue (${progress(j)}/${j.sbs.length})</button>`:`<button class="btn s" onclick="go('report',{jid:'${j.id}'})">View report</button>`}</div></div>`});
 return h}
function startJob(id){const j=J(id);snap(j,S.reg);j.status="In Progress";save();go("form",{jid:id,sb:j.sbs[0].id});toast("Blank form created from this site's switchboard register")}
function vForm(){const j=J(S.jid);let sb=S.sb;if(!j.sbs.some(s=>s.id===sb))sb=S.sb=j.sbs[0].id;
 let h=`<div class="soft"><a href="#" onclick="go('jobs');return false">My jobs</a> / ${j.num}</div><h2>PMWT inspection — ${esc(j.site)}</h2>
 <div class="soft">${esc(j.client)} · ${j.tech} · ${j.date} · ${progress(j)} of ${j.sbs.length} switchboards complete</div>
 <div class="note">This form was built fresh from the site's <b>current</b> switchboard register. Anything you add, remove or change below applies to this visit's report only; the register updates for <b>future</b> visits when you submit. Past reports never change.</div>
 <div class="card"><b>Overall condition of electrical system</b><div class="condrow">${CONDS.map(c=>`<button class="${(c==="Very Poor"||c==="Poor")?"bad":"good"} ${j.cond===c?"on":""}" onclick="setCond('${c}')">${c}</button>`).join("")}</div></div>
 <div class="pills">${j.sbs.map(s=>`<button class="pill ${sb===s.id?"on":boardDone(j,s.id)?"ok":""}" onclick="S.sb='${s.id}';render()">${boardDone(j,s.id)?"✓ ":""}${s.id}</button>`).join("")}</div>`;
 const b=j.sbs.find(s=>s.id===sb);
 h+=`<h3>SWITCHBOARD NAME: ${b.id} &nbsp;·&nbsp; LOCATION: ${b.loc}</h3>
 <h3 class="sec">Part 1 — General maintenance</h3><table><tr><th>Check</th><th style="width:150px">Yes / No</th><th style="width:36%">Comments</th></tr>
 ${CHECKS.map((c,i)=>{const g=j.gm[sb][i];return`<tr><td>${c}</td><td><div class="yn"><button class="Y ${g.r==="Yes"?"on":""}" onclick="gm(${i},'Yes')">Yes</button><button class="N ${g.r==="No"?"on":""}" onclick="gm(${i},'No')">No</button></div></td>
 <td><input type="text" value="${esc(g.c)}" placeholder="${g.r==="No"?"Describe the issue (required)":""}" oninput="j_gc(${i},this.value)"></td></tr>`}).join("")}</table>
 <h3 class="sec">Part 2 — Inspection report (items connected to this switchboard)</h3>
 <table><tr><th>Area name</th><th>Item</th><th style="width:70px">Qty</th><th style="width:150px">Result</th><th style="width:28%">Comments</th><th style="width:70px"></th></tr>
 ${lines(j,sb).map(l=>`<tr class="${l.removed?"gone":""}">
 <td><input type="text" value="${esc(l.area)}" placeholder="e.g. Office 1" ${l.removed?"disabled":""} oninput="la('${l.id}',this.value)"></td>
 <td>${lbl(l)}${l.added?'<span class="tag tnew">NEW</span>':""}${l.removed?'<span class="tag trem">REMOVED</span>':""}</td>
 <td><input type="number" min="0" value="${l.qty}" ${l.removed?"disabled":""} onchange="lq('${l.id}',this.value)"></td>
 <td><select class="r-${l.r||""}" ${l.removed?"disabled":""} onchange="lr('${l.id}',this.value)"><option value="">Select…</option>${RESULTS.map(r=>`<option ${l.r===r?"selected":""}>${r}</option>`).join("")}</select></td>
 <td><input type="text" ${l.removed?"disabled":""} value="${esc(l.c)}" placeholder="${l.r==="Defective"||l.r==="See Comments"?"Comment required":""}" oninput="lc('${l.id}',this.value)"></td>
 <td>${l.removed?`<button class="btn s" onclick="rm('${l.id}')">Undo</button>`:`<button class="btn s" title="No longer connected" onclick="rm('${l.id}')">Remove</button>`}</td></tr>`).join("")}</table>
 <div class="card row"><b>Found something new?</b><input type="text" id="na" placeholder="Area name" style="width:140px"><select id="nt" style="width:110px" onchange="fillSub()">${Object.keys(CAT).map(t=>`<option>${t}</option>`).join("")}</select><select id="ns" style="width:130px"></select><input type="number" id="nq" min="1" value="1"><button class="btn s" onclick="addItem()">+ Add to this board</button></div>
 <h3 class="sec">Board comments</h3><textarea rows="3" oninput="S.jobs.find(x=>x.id==S.jid).bc['${sb}']=this.value;save()" placeholder="General notes for this switchboard">${esc(j.bc[sb])}</textarea>
 <div class="row" style="margin-top:18px"><button class="btn" ${(progress(j)<j.sbs.length||!j.cond)?"disabled":""} onclick="submitJob()">Complete inspection &amp; sign off</button><span class="soft">${!j.cond?"Select the overall system condition above.":progress(j)<j.sbs.length?"Every switchboard needs all checks answered (comments required for No / Defective / See Comments).":"Ready to submit."}</span></div>`;
 return h}
const setCond=c=>{J(S.jid).cond=c;save();render()};
const gm=(i,r)=>{const g=J(S.jid).gm[S.sb][i];g.r=r;if(r==="No"&&g.c===DEF)g.c="";if(r==="Yes"&&!g.c.trim())g.c=DEF;save();render()};
const j_gc=(i,v)=>{J(S.jid).gm[S.sb][i].c=v;save()};
const L=id=>J(S.jid).lines.find(l=>l.id===id);
const la=(id,v)=>{L(id).area=v;save()};
const lr=(id,v)=>{L(id).r=v||null;save();render()};const lc=(id,v)=>{L(id).c=v;save()};const lq=(id,v)=>{L(id).qty=Math.max(0,+v||0);save()};
const rm=id=>{const l=L(id);l.removed=!l.removed;if(l.removed){l.r="N/A";if(!l.c)l.c="Removed – no longer connected"}else{l.r=null;l.c=""}save();render()};
function fillSub(){$("ns").innerHTML=CAT[$("nt").value].map(s=>`<option>${s}</option>`).join("")}
function addItem(){const j=J(S.jid),t=$("nt").value,s=$("ns").value,q=Math.max(1,+$("nq").value||1),area=$("na").value.trim()||"New area";const n=Math.max(0,...lines(j,S.sb).map(l=>l.line))+1;
 j.lines.push({id:j.id+"-n"+(++S.nn),sb:S.sb,reg:null,type:t,sub:s,qty:q,line:n,area,r:null,c:"",added:true,removed:false});save();render();toast("Added to this report. It joins the register on submit.")}
function submitJob(){const j=J(S.jid);
 j.lines.forEach(l=>{if(l.added&&!l.reg){const id="R"+Date.now()+l.id;S.reg.push({id,sb:l.sb,type:l.type,sub:l.sub,qty:l.qty,line:l.line,area:l.area,active:true,added:j.date,removed:null,note:`Added on site ${j.date} (${j.num})`});l.reg=id}
 else if(l.reg){const x=S.reg.find(r=>r.id===l.reg);if(!x)return;if(l.removed){x.active=false;x.removed=j.date;x.note=`Removed on ${j.date} (${j.num})`}else{if(x.qty!==l.qty){x.note=`Qty ${x.qty} → ${l.qty} on ${j.date} (${j.num})`;x.qty=l.qty}if(l.area&&l.area!==x.area){x.note=(x.note?x.note+"; ":"")+`Renamed to "${l.area}" on ${j.date}`;x.area=l.area}}}});
 j.status="Submitted";save();
 if(WEBHOOK){fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(exportPayload(j))}).then(()=>toast("Submitted and sent to Airtable via n8n.")).catch(()=>toast("Submitted here, but the n8n webhook could not be reached."))}
 else{toast("Submitted. Register updated for future visits.")}
 go("report",{jid:j.id})}
function exportPayload(j){return{job:{jobNumber:j.num,client:j.client,site:j.site,technician:j.tech,date:j.date,status:j.status,overallCondition:j.cond},
 generalMaintenance:j.sbs.flatMap(s=>j.gm[s.id].map((g,i)=>({switchboard:s.id,check:CHECKS[i],result:g.r,comment:g.c}))),
 itemResults:j.lines.map(l=>({switchboard:l.sb,area:l.area,item:lbl(l),qty:l.qty,result:l.r,comment:l.c,addedOnSite:!!l.added,removedOnSite:!!l.removed})),
 boardComments:j.sbs.filter(s=>(j.bc[s.id]||"").trim()).map(s=>({switchboard:s.id,comment:j.bc[s.id].trim()})),
 timeclocks:[]}} // Timeclocks retired from this form — always sent empty so n8n's Timeclock Results step simply does nothing
function copyJson(){const t=JSON.stringify(exportPayload(J(S.jid)),null,1);
 try{navigator.clipboard.writeText(t).then(()=>toast("Copied — paste into an n8n Manual trigger to test your mapping."))}
 catch(e){toast("Copy not available in this browser context")}}
/* ---------- Admin ---------- */
function vAdmin(){const nj=S.nj=S.nj||{client:"",site:""};
 const cl=DB.clients.find(c=>c.name===nj.client);const st=cl&&cl.sites.find(s=>s.name===nj.site);
 let h=`<h2>Jobs &amp; scheduling</h2><div class="card"><div class="row sp"><b>New PMWT booking</b><span class="badge" title="${SRC==="live"?"Clients and sites were just read from Airtable":"Could not reach Airtable, showing the built-in snapshot"}">${SRC==="live"?"● Live from Airtable":"○ Offline snapshot"}</span></div>
 <div class="row" style="margin-top:10px"><select id="jc" style="width:190px" onchange="pickClient(this.value)"><option value="">1. Select client…</option>${DB.clients.map(c=>`<option ${c.name===nj.client?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
 <select id="js" style="width:190px" ${cl?"":"disabled"} onchange="pickSite(this.value)"><option value="">2. Select site…</option>${cl?cl.sites.map(s=>`<option ${s.name===nj.site?"selected":""}>${esc(s.name)}</option>`).join(""):""}</select></div>
 ${st?`<div class="note">Job <b class="mono">${nextNum()}</b> will be created for <b>${esc(nj.client)} — ${esc(nj.site)}</b> with <b>${st.boards.length} switchboard${st.boards.length===1?"":"s"}</b>: ${st.boards.map(b=>`${b.id} (${esc(b.loc)}, ${b.items.length} item lines)`).join(" · ")}. The technician's form is filled from these boards' registers.</div>`:`<p class="soft" style="margin:10px 0 0">Choose a client, then one of that client's sites.</p>`}
 <div class="row" style="margin-top:10px"><input type="date" id="jd" style="width:150px" value="${new Date().toISOString().slice(0,10)}"><select id="jt" style="width:170px">${techs().map(t=>`<option>${esc(t)}</option>`).join("")}</select><button class="btn" ${st?"":"disabled"} onclick="addJob()">Create job &amp; allocate</button></div></div>`;
 S.jobs.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(j=>h+=`<div class="card row sp"><div><span class="mono">${j.num}</span> · ${esc(j.client)} — ${esc(j.site)} · ${j.date} · ${j.tech}<div class="soft">${j.sbs.length} switchboard${j.sbs.length===1?"":"s"}: ${j.sbs.map(s=>s.id).join(", ")}</div></div><div class="row"><span class="badge b-${j.status.replace(/ /g,"")}">${j.status}</span>${["Submitted","Report Issued"].includes(j.status)?`<button class="btn s" onclick="go('report',{jid:'${j.id}'})">Report</button>`:""}<button class="btn s" style="background:#b42318;color:#fff" title="Delete this job" onclick="deleteJob('${j.id}')">Delete</button></div></div>`);
 const act=S.reg.filter(r=>r.active).length;
 return h+`<p class="soft">Register held in this browser: ${act} active items across ${new Set(S.reg.map(r=>r.sb)).size} switchboards (${S.reg.length-act} retired, kept for history).</p>
 <div class="card"><b>Connecting to Airtable</b><p class="soft" style="margin-top:6px">Clients, sites, switchboards and register items are read live from Airtable through a read-only n8n workflow (<span class="mono">CATALOG_URL</span>), and each submitted inspection is sent back through <span class="mono">WEBHOOK</span>. If Airtable cannot be reached, the page falls back to a built-in snapshot and the badge above shows "Offline snapshot".</p></div>
 <div class="card"><b>Reset demo data</b><p class="soft" style="margin-top:6px">Clears every job and register copy stored in this browser and starts fresh with the original seed data, then re-reads the catalog from Airtable — use this before a client demo so old test submissions don't show up. It does not touch anything already sent to Airtable.</p><button class="btn" style="margin-top:8px;background:#b42318" onclick="resetDemo()">Reset demo data</button></div>`}
const pickClient=v=>{S.nj={client:v,site:""};render()};
const pickSite=v=>{S.nj.site=v;render()};
function resetDemo(){if(!confirm("This clears all jobs and history saved in this browser and starts over with fresh demo data. Continue?"))return;localStorage.removeItem("fo4");location.reload()}
function deleteJob(id){const j=J(id);if(!j)return;if(!confirm(`Delete job ${j.num} (${j.date})? This only removes it from this browser's demo data — it does NOT delete anything already sent to Airtable. Delete dummy/test jobs there separately in Airtable itself.`))return;S.jobs=S.jobs.filter(x=>x.id!==id);save();render();toast("Job deleted from this browser's demo data.")}
function addJob(){const nj=S.nj||{};const st=findSite(nj.client,nj.site);if(!st){toast("Select a client and a site first.");return}
 const j=newJob("j"+Date.now(),nextNum(),$("jd").value,$("jt").value,nj.client,nj.site,S.reg);S.jobs.push(j);save();render();toast(`Job ${j.num} created with ${j.sbs.length} switchboard${j.sbs.length===1?"":"s"}. The technician sees it on their list.`)}
function vHist(){const sb=S.hsb;const ids=allBoardIds();let h=`<h2>Switchboard history</h2><div class="row"><span class="soft">Switchboard</span><select style="width:140px" onchange="S.hsb=this.value;render()">${ids.map(s=>`<option ${s===sb?"selected":""}>${s}</option>`).join("")}</select></div>`;
 h+=`<h3 class="sec">Register (what is connected now, and what changed)</h3><table><tr><th>Area</th><th>Item</th><th>Qty</th><th>Status</th><th>Added</th><th>Removed</th><th>Note</th></tr>${S.reg.filter(r=>r.sb===sb).sort((a,b)=>a.line-b.line).map(r=>`<tr style="${r.active?"":"opacity:.55"}"><td>${esc(r.area)}</td><td>${lbl(r)}</td><td>${r.qty}</td><td>${r.active?"Active":"Retired"}</td><td>${r.added}</td><td>${r.removed||"—"}</td><td class="soft">${r.note}</td></tr>`).join("")}</table>`;
 S.jobs.filter(j=>["Submitted","Report Issued"].includes(j.status)&&j.gm[sb]).sort((a,b)=>b.date.localeCompare(a.date)).forEach(j=>{
  h+=`<div class="card"><div class="row sp"><b>${j.date}</b> <span class="badge">${j.cond||"—"}</span><span class="soft">${j.num} · ${j.tech}</span></div><div style="margin:8px 0">${j.gm[sb].map((g,i)=>`<span class="chip ${g.r==="Yes"?"Y":"N"}" title="${esc(g.c)}">${CHECKS[i].split(" ").slice(0,3).join(" ")}: ${g.r}</span>`).join("")}</div>
  <table><tr><th>Area</th><th>Item (as at this visit)</th><th>Qty</th><th>Result</th><th>Comment</th></tr>${lines(j,sb).map(l=>`<tr><td>${esc(l.area)}</td><td>${lbl(l)}${l.added?'<span class="tag tnew">NEW</span>':""}${l.removed?'<span class="tag trem">REMOVED</span>':""}</td><td>${l.qty}</td><td>${l.r}</td><td class="soft">${esc(l.c)}</td></tr>`).join("")}</table></div>`});
 return h}
function defects(){const d=[];S.jobs.filter(j=>["Submitted","Report Issued"].includes(j.status)).forEach(j=>j.sbs.forEach(s=>{j.gm[s.id].forEach((g,i)=>g.r==="No"&&d.push({j,sb:s.id,t:CHECKS[i],c:g.c}));lines(j,s.id).forEach(l=>l.r==="Defective"&&d.push({j,sb:s.id,t:esc(l.area)+" — "+lbl(l)+" x"+l.qty,c:l.c}))}));return d}
function vDef(){const d=defects();return`<h2>Defect register</h2><p class="soft">Raised automatically from every "No" (Part 1) and "Defective" (Part 2), across all visits.</p><table><tr><th>Visit</th><th>Board</th><th>Item</th><th>Comment</th></tr>${d.map(x=>`<tr><td class="mono">${x.j.date}<br>${x.j.num}</td><td>${x.sb}</td><td>${x.t}</td><td>${esc(x.c)}</td></tr>`).join("")||'<tr><td colspan="4">None</td></tr>'}</table>`}
function vReport(){const j=J(S.jid);let h=`<div class="row no-print" style="margin-bottom:12px"><button class="btn s" onclick="go('${S.role==="tech"?"jobs":"admin"}')">← Back</button><button class="btn" onclick="print()">🖨 Print / Save as PDF</button><button class="btn s" onclick="copyJson()">Copy inspection data (JSON)</button></div><div id="rep">
 <div class="orange"><h2>PREVENTATIVE MAINTENANCE<br>INSPECTION REPORT ${j.date}</h2></div>
 <p><b>SITE NAME</b> ${esc(j.site)} &nbsp; <b>CLIENT</b> ${esc(j.client)} &nbsp; <b>SERVICE JOB #</b> ${j.num} &nbsp; <b>TECHNICIAN</b> ${j.tech}</p>
 <p><b>OVERALL CONDITION OF ELECTRICAL SYSTEM:</b> ${CONDS.map(c=>c===j.cond?`<span style="background:#FFD966;padding:2px 8px;font-weight:700">✓ ${c}</span>`:`<span class="soft">${c}</span>`).join(" &nbsp; ")}</p>`;
 j.sbs.forEach(s=>{
 h+=`<hr><p><b>SWITCHBOARD NAME:</b> ${s.id} &nbsp; <b>LOCATION:</b> ${s.loc}</p>
 <h4>GENERAL MAINTENANCE</h4><table><tr><th>Check</th><th>YES/NO</th><th>Comments</th></tr>${j.gm[s.id].map((g,i)=>`<tr><td>${CHECKS[i]}</td><td style="background:${g.r==="Yes"?"#E2EFDA":"#FFD966"}">${g.r}</td><td>${g.r==="No"?"See comments: ":""}${esc(g.c)}</td></tr>`).join("")}</table>
 <h4>INSPECTION REPORT</h4><table><tr><th>Area</th><th>Item</th><th>Operational (Yes/No)</th><th>Issues</th><th>Action</th></tr>${lines(j,s.id).map(l=>{const na=l.r==="N/A";return`<tr${l.removed?' style="opacity:.6"':""}><td>${esc(l.area)}</td><td>${lbl(l)} x${l.qty}${l.added?" (new)":""}${l.removed?" (removed)":""}</td><td>${na?"N/A":l.r==="Defective"?"No":"Yes"}</td><td>${na?"N/A":l.r==="No issues"?"No Issues":l.r}</td><td>${l.c?esc(l.c):"N/A"}</td></tr>`}).join("")}</table>
 <h4>COMMENTS</h4><p class="soft">${esc(j.bc[s.id])||"—"}</p>`});return h+"</div>"}
function render(){const t=S.role==="tech";$("rt").classList.toggle("on",t);$("ra").classList.toggle("on",!t);
 const items=t?[["jobs","My jobs"]]:[["admin","Jobs & scheduling"],["hist","Switchboard history"],["def","Defect register"]];
 $("nav").innerHTML=items.map(([k,l])=>`<button class="${S.view===k||(k==="jobs"&&S.view==="form")?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
 $("v").innerHTML={jobs:vJobs,form:vForm,admin:vAdmin,hist:vHist,def:vDef,report:vReport}[S.view]();
 $("src").textContent=SRC==="live"?"● Airtable: live":"○ Airtable: offline snapshot";
 if($("nt"))fillSub();save()}
function loadCatalog(){if(!CATALOG_URL)return;fetch(CATALOG_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{if(!d||!d.clients||!d.clients.length)throw 0;DB=fromLive(d);SRC="live";if(S.view==="admin"||S.view==="jobs")render();else $("src").textContent="● Airtable: live"}).catch(()=>{})}
document.getElementById("companyName").textContent=COMPANY;
render();loadCatalog();
</script></body></html>
