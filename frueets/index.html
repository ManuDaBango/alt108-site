<!DOCTYPE html>
<!--
  GAME OF FRUEETS - Step 9: Modern look, new sounds, winner plays again

  The game has three screens:
    HOME      - jackpot pile, enter your name(s), scoreboard of everyone's last 3 games
    GAME      - your 3 balls, the board, the pull button
    PAY TABLE - opens on top of either screen

  (Steps 5 to 8 added: mobile layout, the ticket of 3 balls, dollars, player names and scoreboard, the jackpot pile,
   pass-and-play for 1 to 5 players, sounds made inside the browser, and fruit pictures drawn as SVG.)

  NEW IN STEP 9 (look for "NEW IN 9"):
  1. A modern, glossy "casual mobile game" look (think Candy Crush and Angry Birds): a bright sky, chunky rounded letters,
     shiny candy buttons that squish when pressed, a glossy red ball and gold pegs. The 1960s look and the flashing
     border lights are gone: the board now has a calm white frame.
  2. Bigger fruit pictures in the cups. The cups are taller and the pictures sit in two staggered rows so each one can be
     much bigger than the cup is wide. (Switch it off with CUP_ICON_STAGGER.) The screen layout is also tighter so the
     board itself is as large as the phone allows.
  3. New sounds: soft marimba and glockenspiel notes, bubbly pops, a musical scale that climbs while you pull, sparkle
     showers on a win. (Still no sound files: everything is built in the browser.)
  4. New rule: win a real prize and you play again. Your turn only passes when a game does not win (see KEEP_TURN_MIN_PAYOUT).
  5. The power meter now loops: when it reaches the end it starts again from the beginning. It is also 10% faster.
  6. The game file is now completely self-contained: the physics library (Matter.js) is inside it, so it needs no internet.
     It also has a home-screen icon and a warning message if it is opened somewhere that cannot run it (for example a
     file preview on a phone). To play on a phone, put the file on a web address (see the manual).
-->

    /* ---------- Colours and fonts in one place ----------
       Each glossy button has three colours: a light top, a deeper bottom, and a dark "edge" (the thick underside). */
    :root {
      --ink:        #3b1d78;   /* deep purple: all text */
      --ink-soft:   #7a65b0;   /* quieter text */
      --white:      #ffffff;
      --panel:      #ffffff;
      --shadow:     rgba(48, 20, 110, 0.30);

      --orange-top: #ffd23f;  --orange-bot: #ff9a00;  --orange-edge: #c4650a;
      --green-top:  #8cf24e;  --green-bot:  #2fc83a;  --green-edge:  #1b8a2a;
      --blue-top:   #6fd3ff;  --blue-bot:   #2d8cf0;  --blue-edge:   #1b5fb3;
      --pink-top:   #ff8fbd;  --pink-bot:   #f0357f;  --pink-edge:   #a81458;
      --cloud-top:  #ffffff;  --cloud-bot:  #e6e0fb;  --cloud-edge:   #a79ad6;

      --win:  #2fb44a;
      --lose: #f0457a;
      --even: #a99bd4;

      --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      --body:    "Nunito", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      -webkit-tap-highlight-color: transparent;   /* no grey flash when tapping on a phone */
      touch-action: manipulation;                 /* no double-tap zoom */
    }
    body {
      color: var(--ink);
      font-family: var(--body);
      font-weight: 700;
      /* A bright sky that deepens to candy purple, with soft bubbles floating in it (stacked background layers). */
      background-color: #6d6bf5;
      background-image:
        radial-gradient(circle at 5% 62%, rgba(255, 255, 255, 0.30) 0 3.2vmin, rgba(255, 255, 255, 0) 3.4vmin),
        radial-gradient(circle at 86% 24%, rgba(255, 255, 255, 0.22) 0 5vmin,   rgba(255, 255, 255, 0) 5.2vmin),
        radial-gradient(circle at 70% 78%, rgba(255, 255, 255, 0.16) 0 7vmin,   rgba(255, 255, 255, 0) 7.2vmin),
        radial-gradient(circle at 18% 88%, rgba(255, 255, 255, 0.20) 0 4vmin,   rgba(255, 255, 255, 0) 4.2vmin),
        linear-gradient(180deg, #4cc3ff 0%, #6f7bff 48%, #a357f0 100%);
      background-attachment: fixed;
    }

    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .hidden { display: none !important; }

    /* The whole game sits in a phone-shaped column, centred on bigger screens */
    #app { max-width: 480px; height: 100%; margin: 0 auto; position: relative; }

    .screen { height: 100vh; height: 100dvh; }   /* dvh = the visible height on a phone, ignoring the address bar */

    /* NEW IN 9: shown only if the page's scripts do NOT run (for example a file preview on a phone).
       The game hides it the moment it starts, so anyone who can play never sees it. */
    #noScript {
      margin: 10px 0 14px 0; padding: 12px 14px; border-radius: 16px;
      background: #fff3c4; color: #5a3a00; font-size: 15px; line-height: 1.35;
      border: 3px solid #ffb300;
    }
    #noScript b { font-family: var(--display); font-weight: 400; font-size: 18px; display: block; margin-bottom: 4px; }

    /* The title: chunky white letters with a purple outline and a chunky shadow. */
    h1 {
      margin: 8px 0 6px 0;
      text-align: center;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(36px, 12vw, 52px);
      line-height: 1;
      color: #fff;
      -webkit-text-stroke: 7px #4a24a8;
      paint-order: stroke fill;
      text-shadow: 0 5px 0 #4a24a8, 0 9px 12px rgba(30, 10, 80, 0.35);
      letter-spacing: 0.5px;
    }
    /* A row of fruit under the title that bobs gently (filled in by the script) */
    #hero { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
    #hero img { display: block; filter: drop-shadow(0 3px 2px rgba(48, 20, 110, 0.35)); animation: bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.18s); }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    h2 { margin: 0 0 8px 0; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ink); }

    /* Panels: white, very round, with a soft drop shadow and a thick underside. */
    .card {
      background: var(--panel);
      border-radius: 24px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 6px 0 var(--shadow), 0 14px 22px rgba(30, 10, 80, 0.18);
    }

    /* ----- GLOSSY CANDY BUTTONS -----
       Recipe: a light-to-deep gradient, a dark thick edge underneath (the box-shadow with no blur), and a bright
       curved highlight on the top half (the inset shadow). When pressed, the button sinks into its edge.
       Colours come from the --top / --bot / --edge variables set by the colour classes below. */
    .btn, button.primary, button.secondary {
      --top: var(--orange-top); --bot: var(--orange-bot); --edge: var(--orange-edge);
      position: relative;
      width: 100%;
      color: #fff;
      font-family: var(--display);
      font-weight: 400;
      letter-spacing: 0.4px;
      -webkit-text-stroke: 3px var(--edge);
      paint-order: stroke fill;
      text-shadow: 0 2px 0 var(--edge);
      background: linear-gradient(180deg, var(--top) 0%, var(--bot) 100%);
      border: none;
      border-radius: 18px;
      box-shadow: 0 5px 0 var(--edge), 0 9px 12px rgba(30, 10, 80, 0.25), inset 0 3px 0 rgba(255, 255, 255, 0.55), inset 0 -3px 0 rgba(0, 0, 0, 0.08);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    button.primary   { padding: 13px; font-size: 24px; --top: var(--green-top); --bot: var(--green-bot); --edge: var(--green-edge); }
    button.secondary { padding: 9px;  font-size: 18px; --top: var(--blue-top);  --bot: var(--blue-bot);  --edge: var(--blue-edge); }
    button.orange { --top: var(--orange-top); --bot: var(--orange-bot); --edge: var(--orange-edge); }
    button.pink   { --top: var(--pink-top);   --bot: var(--pink-bot);   --edge: var(--pink-edge); }
    button.cloud  { --top: var(--cloud-top);  --bot: var(--cloud-bot);  --edge: var(--cloud-edge); color: var(--ink); -webkit-text-stroke: 0; text-shadow: none; }
    button.primary:active, button.secondary:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--edge), 0 3px 6px rgba(30, 10, 80, 0.25), inset 0 3px 0 rgba(255, 255, 255, 0.45);
    }
    /* The big green Play button breathes gently so it invites a tap. */
    #startBtn { animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }

    button.link {
      background: none; border: none; color: #fff; font-weight: 800; font-size: 15px; padding: 6px 10px;
      text-decoration: underline; text-shadow: 0 1px 3px rgba(30, 10, 80, 0.5);
    }

    /* ---------- HOME SCREEN ---------- */
    #screenHome { overflow-y: auto; padding: 14px 14px 28px 14px; }

    .potBox {
      text-align: center;
      margin-bottom: 18px;
      padding: 8px 8px 10px 8px;
      background: linear-gradient(180deg, #fffbe0 0%, #ffe9a0 100%);
      border-radius: 24px;
      box-shadow: 0 6px 0 #d9a21c, 0 14px 22px rgba(30, 10, 80, 0.18), inset 0 3px 0 rgba(255, 255, 255, 0.9);
    }
    .potBox canvas { display: block; margin: 0 auto; }
    /* The jackpot pile canvases are drawn with extra pixels (see sharpenPotCanvases), so their on-screen size is fixed here. */
    #potBig  { width: 260px; height: 96px; }
    #potMini { width: 110px; height: 52px; }
    .potLabel { font-family: var(--display); font-size: 22px; color: #e0780a; line-height: 1.1; }
    .potLabel b { display: block; font-family: var(--display); font-weight: 400; font-size: 46px; color: var(--ink); line-height: 1.05; }

    label { font-size: 16px; font-weight: 800; color: var(--ink); }
    .hint { font-size: 14px; color: var(--ink-soft); text-align: center; margin-top: 10px; }

    /* One row per player on the home screen: a name box, and a small remove button when there are 2 or more */
    .nameRow { display: flex; gap: 6px; align-items: center; margin: 6px 0 8px 0; }
    .nameRow button.removeBtn {
      flex: none; width: 44px; height: 44px; font-size: 16px; font-weight: 800; color: var(--ink);
      background: #efeafc; border: none; border-radius: 14px; padding: 0; box-shadow: 0 3px 0 #c9bfeb;
    }
    #addPlayerBtn { margin-bottom: 12px; }
    .nameInput {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      margin: 0;
      font: inherit;
      font-weight: 800;
      font-size: 18px;            /* 16px or more stops iPhones zooming in when you tap the box */
      border: 3px solid #d9d0f5;
      border-radius: 14px;
      background: #f7f4ff;
      color: var(--ink);
    }
    .nameInput:focus { border-color: #6f7bff; background: #fff; outline: none; }

    .sbRow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 2px solid #efeafc; }
    .sbRow:last-child { border-bottom: none; }
    .rank { width: 22px; font-family: var(--display); font-size: 18px; color: #ff8a00; }
    .sbName { flex: 1; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chips { display: flex; gap: 4px; }
    .chip { font-style: normal; font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 12px; color: #fff; }
    .win  { background: var(--win); }
    .lose { background: var(--lose); }
    .even { background: var(--even); }
    .sbTotal { min-width: 54px; text-align: right; font-family: var(--display); font-weight: 400; font-size: 18px; }
    .sbTotal.win  { background: none; color: var(--win); }
    .sbTotal.lose { background: none; color: var(--lose); }
    .sbTotal.even { background: none; color: var(--even); }
    .empty { color: var(--ink-soft); font-size: 15px; text-align: center; padding: 8px 0; }

    .linkRow { text-align: center; }

    /* ---------- GAME SCREEN ----------
       NEW IN 9: tighter. Everything that is not the board is squeezed so the board (which is tall and thin) can be as
       big as possible. The Pay table, Sound and End game buttons moved into a menu (the round button at the bottom right). */
    #screenGame {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: calc(6px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)) 10px;
    }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 4px; }

    /* The players strip. One small card per player: name on top, balance underneath.
       Whoever's turn it is turns gold and lifts a little. Players who are out fade away. */
    #players { display: flex; gap: 6px; flex: 1; min-width: 0; margin-right: 10px; }
    .pChip {
      flex: 1 1 0;
      max-width: 96px;
      min-width: 0;                    /* lets long names shrink instead of pushing the strip wider */
      background: #fff;
      border-radius: 14px;
      padding: 2px 6px 3px 6px;
      line-height: 1.1;
      box-shadow: 0 3px 0 var(--shadow);
      transition: transform 0.15s;
    }
    .pName { display: block; font-size: 12px; font-weight: 800; color: var(--ink-soft);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pBal  { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; }
    .pChip.current { background: linear-gradient(180deg, #fff6b8, #ffd23f); transform: translateY(-2px); box-shadow: 0 5px 0 #c4850a, 0 0 0 3px #fff; }
    .pChip.current .pName { color: var(--ink); }
    .pChip.out { opacity: 0.5; filter: grayscale(0.7); }
    /* With only one player there is nothing to compare, so show the big plain balance, straight on the sky. */
    #players.solo .pChip { background: none; box-shadow: none; padding: 0; max-width: none; transform: none; }
    #players.solo .pName { font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(30, 10, 80, 0.55); }
    #players.solo .pBal  { font-size: 30px; color: #fff; -webkit-text-stroke: 5px #4a24a8; paint-order: stroke fill; text-shadow: 0 3px 0 #4a24a8; }
    /* With several players the strip takes the whole width (see buildPlayerStrip, which moves the jackpot pile into the ticket). */
    #players:not(.solo) { margin-right: 0; }

    .potMini { text-align: right; line-height: 1; }
    .potMini canvas { display: block; margin-left: auto; }
    #potMiniAmount { font-family: var(--display); font-weight: 400; font-size: 16px; color: #fff; -webkit-text-stroke: 4px #4a24a8; paint-order: stroke fill; }
    #ticket .potMini { flex: none; width: 66px; }
    #ticket .potMini canvas { width: 66px; height: 30px; margin-left: 0; }
    #ticket #potMiniAmount { font-size: 14px; color: #e0780a; -webkit-text-stroke: 0; }
    /* With one player the name and balance move into the ticket row (see buildPlayerStrip), saving a whole row of height. */
    #ticket #players.solo { margin: 0; flex: 1; min-width: 0; }
    #ticket #players.solo .pName { color: var(--ink-soft); text-shadow: none; font-size: 12px; }
    #ticket #players.solo .pBal  { color: var(--ink); -webkit-text-stroke: 0; text-shadow: none; font-size: 26px; }

    /* The ticket: the three balls you are playing for, in one slim row. */
    #ticket {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #fff;
      border-radius: 20px;
      padding: 5px 12px;
      box-shadow: 0 4px 0 var(--shadow);
    }
    .ticketLabel { flex: 1; min-width: 0; font-family: var(--display); font-size: 17px; color: var(--ink); text-align: left;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slots { display: flex; gap: 8px; }
    .slot {
      width: clamp(36px, 10.5vw, 44px);
      height: clamp(36px, 10.5vw, 44px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot img { width: 82%; height: 82%; display: block; }
    /* An unplayed ball is a glossy purple counter with a number. */
    .slot.counter { background: radial-gradient(circle at 35% 30%, #a98bff, #5b3fd6 70%); color: #fff; font-family: var(--display); font-size: clamp(18px, 5.5vw, 22px); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
    .slot.filled  { background: #f3efff; box-shadow: inset 0 -3px 0 #d9d0f5; animation: pop 0.35s; }
    .slot.current { box-shadow: 0 0 0 3px #ffd23f, inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
    @keyframes pop { 0% { transform: scale(0.4); } 65% { transform: scale(1.2); } 100% { transform: scale(1); } }

    /* The board takes whatever height is left over. Inside it sits the FRAME, which JavaScript (fitBoard) sizes to
       exactly the same shape as the board picture (400 wide : 650 tall), so the frame hugs the board at any screen size. */
    #boardArea {
      flex: 1;
      min-height: 0;                  /* lets the box shrink on small phones */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 2px 6px 2px;         /* room for the frame's shadow */
    }

    /* NEW IN 9: the frame is a calm white border with rounded corners and a soft shadow. No lights.
       (The board still gets the same exact shape from fitBoard, which reads this border width.) */
    #boardWrap {
      position: relative;
      box-sizing: content-box;        /* width and height set by fitBoard measure the picture only. The border is extra. */
      aspect-ratio: 400 / 650;        /* a sensible shape even before JavaScript runs */
      max-width: 100%;
      max-height: 100%;
      border: 6px solid #fff;
      border-radius: 22px;
      overflow: hidden;
      background-color: #5b3fd6;
      box-shadow: 0 6px 0 var(--shadow), 0 14px 22px rgba(30, 10, 80, 0.25);
    }
    /* After a win the frame gives one happy little bounce (once, not a flashing light). */
    #boardWrap.celebrate { animation: happy 0.6s ease-out 1; }
    @keyframes happy { 0% { transform: scale(1); } 35% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #boardWrap.celebrate, #hero img, #startBtn, .slot.filled { animation: none; } }
    #board { width: 100%; height: 100%; display: block; }   /* frame has the same shape, so no letterbox gaps */

    /* The message line floats over the empty top of the board (above the pegs). */
    #status {
      position: absolute;
      left: 50%;
      top: 9%;
      transform: translateX(-50%);
      max-width: 92%;
      padding: 3px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status:empty { display: none; }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(60, 24, 130, 0.50);
      padding: 14px;
    }
    #overlayCard {
      background: #fff;
      border-radius: 26px;
      padding: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 7px 0 var(--shadow), 0 16px 30px rgba(30, 10, 80, 0.35);
      animation: popIn 0.4s cubic-bezier(0.2, 1.4, 0.4, 1);
    }
    @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    #ovTitle { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; color: #ff7a00; margin-bottom: 8px; text-shadow: 0 3px 0 rgba(255, 154, 0, 0.25); }
    #ovLines div { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    #ovButtons { margin-top: 14px; display: grid; gap: 12px; }

    /* The power meter: a slim tube with a rainbow candy fill. It loops, so it is drawn by clipping a full rainbow
       (see refreshControls) rather than by stretching it. */
    #gauge { height: 14px; background: rgba(48, 20, 110, 0.40); border-radius: 10px; overflow: hidden; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(255, 255, 255, 0.5); }
    #gaugeFill { height: 100%; width: 100%; background: linear-gradient(90deg, #7cf04a 0%, #ffe03a 45%, #ff9a00 72%, #ff3d6e 100%); clip-path: inset(0 100% 0 0); }

    /* The bottom row: a small Shuffle button, the big pull button, and a round menu button. */
    .pullRow { display: flex; gap: 8px; align-items: stretch; }
    #reshuffleBtn { flex: none; width: 74px; padding: 4px; font-size: 16px; line-height: 1.05; }
    #menuBtn { flex: none; width: 54px; padding: 0; font-size: 26px; line-height: 1; }
    #pullBtn {
      flex: 1;
      height: 62px;
      font-size: 25px;
      white-space: nowrap;
      overflow: hidden;
      --top: var(--orange-top); --bot: var(--orange-bot); --edge: var(--orange-edge);
      border-radius: 22px;
      touch-action: none;             /* the finger must not scroll or zoom the page while holding this */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;    /* no "copy" menu on a long press */
    }
    #pullBtn.charging { transform: translateY(5px); box-shadow: 0 0 0 var(--edge), 0 2px 5px rgba(30, 10, 80, 0.25), inset 0 3px 0 rgba(255, 255, 255, 0.45); --top: #ffe56b; --bot: #ffb11a; }
    /* A switched-off button turns a flat lilac (rather than see-through, which went muddy on the sky). */
    button.disabled, #pullBtn.disabled {
      --top: #e7e2f7; --bot: #cdc5e8; --edge: #aaa0cf;
      color: #fff; -webkit-text-stroke: 3px #aaa0cf;
    }

    /* The menu: slides up from the bottom and holds the less-used buttons. */
    #menuSheet {
      position: fixed; inset: 0; z-index: 9;
      background: rgba(60, 24, 130, 0.45);
      display: flex; align-items: flex-end; justify-content: center;
    }
    #menuCard {
      width: 100%; max-width: 480px;
      background: #fff; border-radius: 26px 26px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
      display: grid; gap: 12px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { 0% { transform: translateY(40%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    /* ---------- PAY TABLE SCREEN ---------- */
    #payModal {
      position: fixed;
      inset: 0;
      background: rgba(60, 24, 130, 0.60);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 10;
    }
    #payCard {
      background: #fff;
      border-radius: 26px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 100%;
      overflow-y: auto;
      box-shadow: 0 7px 0 var(--shadow), 0 16px 30px rgba(30, 10, 80, 0.35);
    }
    table { width: 100%; border-collapse: collapse; font-size: 18px; }
    th { text-align: left; font-family: var(--display); font-weight: 400; font-size: 18px; color: #f0357f; padding-top: 12px; }
    td { padding: 3px 0; }
    td:last-child { text-align: right; font-family: var(--display); font-size: 19px; white-space: nowrap; }
    .fruit { display: inline-block; vertical-align: middle; }
    td .fruit { margin-right: 2px; }
    td .plain { font-size: 16px; white-space: nowrap; }
  </style>
</head>
<body>
<div id="app">

  <!-- ================= HOME SCREEN ================= -->
  <section id="screenHome" class="screen">
    <h1>Game of Frueets</h1>
    <div id="hero"></div>

    <!-- NEW IN 9: visible only if the game's code is NOT running. The game hides it as its very first act. -->
    <div id="noScript">
      <b>This page can't run the game yet.</b>
      The buttons won't work here. This usually happens when the file is opened from a chat or from the Files app
      (they only show a preview). Open the game from its web address in Safari or Chrome instead.
    </div>

    <div class="potBox">
      <canvas id="potBig" width="260" height="96"></canvas>
      <div class="potLabel">Jackpot<b id="potBigAmount"></b></div>
    </div>

    <div class="card">
      <label>Who's playing?</label>
      <div id="nameRows"></div>
      <button id="addPlayerBtn" class="secondary">+ Add a player</button>
      <button id="startBtn" class="primary">Play</button>
      <div class="hint" id="startHint"></div>
    </div>

    <div class="card">
      <h2>Last 3 games</h2>
      <div id="scoreboard"></div>
    </div>

    <div class="linkRow">
      <button id="payBtnHome" class="link">Pay table</button>
      <button id="muteBtnHome" class="link"></button>
      <button id="resetBtn" class="link">Reset scoreboard</button>
    </div>
  </section>

  <!-- ================= GAME SCREEN ================= -->
  <section id="screenGame" class="screen hidden">
    <div class="topbar">
      <div id="players"></div>
      <div class="potMini">
        <canvas id="potMini" width="110" height="52"></canvas>
        <b id="potMiniAmount"></b>
      </div>
    </div>

    <!-- The ticket: three counters that turn into fruit -->
    <div id="ticket">
      <div class="ticketLabel" id="ticketLabel">Your 3 balls</div>
      <div class="slots" id="slots"></div>
    </div>

    <div id="boardArea">
    <div id="boardWrap">
      <canvas id="board" width="400" height="650"></canvas>

      <!-- NEW IN 9: the message line now floats over the top of the board -->
      <div id="status"></div>

      <!-- Messages and buttons that appear on top of the board between games -->
      <div id="overlay" class="hidden">
        <div id="overlayCard">
          <div id="ovTitle"></div>
          <div id="ovLines"></div>
          <div id="ovButtons">
            <button id="ovPrimary" class="primary"></button>
            <button id="ovSecondary" class="secondary cloud"></button>
          </div>
        </div>
      </div>
    </div>
    </div>  <!-- end of boardArea -->

    <div id="gauge"><div id="gaugeFill"></div></div>
    <div class="pullRow">
      <button id="reshuffleBtn" class="secondary">Shuffle cups</button>
      <button id="pullBtn" class="btn">HOLD TO PULL</button>
      <button id="menuBtn" class="secondary" aria-label="Menu">&#9776;</button>
    </div>
  </section>

  <!-- NEW IN 9: the menu (Pay table, Sound, End game) -->
  <div id="menuSheet" class="hidden">
    <div id="menuCard">
      <button id="payBtn" class="secondary">Pay table</button>
      <button id="muteBtnGame" class="secondary orange"></button>
      <button id="endBtn" class="secondary pink">End game</button>
      <button id="menuClose" class="secondary cloud">Back to the game</button>
    </div>
  </div>

  <!-- ================= PAY TABLE SCREEN ================= -->
  <div id="payModal" class="hidden">
    <div id="payCard">
      <h2>Pay table</h2>
      <div id="payTable"></div>
      <button id="payClose" class="primary" style="margin-top:12px">Close</button>
    </div>
  </div>

</div>

<script>

<script>
  // NEW IN 9: if this line runs, scripts work, so hide the 'this page cannot run the game' notice.
  document.getElementById("noScript").style.display = "none";

  // ============================================================
  // 1. SETTINGS - the numbers you can change to experiment
  // ============================================================
  const BOARD_WIDTH   = 400;
  const BOARD_HEIGHT  = 640;    // height of the peg and cup area
  const RENDER_SCALE  = 2;      // NEW IN 8: the board is drawn with this many pixels for every one it is "worth", so it stays crisp on phone screens. 1 = blurry but lightest.
  const CANVAS_HEIGHT = 650;    // CHANGED IN 5: the message line and power bar moved out of the canvas into the page

  // --- Pegs ---
  const PEG_RADIUS      = 6;
  const PEG_ROWS        = 5;
  const PEG_SPACING     = 50;
  const FIRST_PEG_ROW_Y = 120;
  const PEG_ROW_GAP     = 45;
  const PEG_BOUNCE      = 0.2;

  // --- Ball ---
  const BALL_RADIUS         = 9;
  const BALL_BOUNCE         = 0.5;
  const GRAVITY             = 1;
  const BALL_AIR_RESISTANCE = 0.06;   // higher = easier to aim, lower = wilder
  const BALL_CLEAR_FRAMES   = 60;     // how long a landed ball sits in its cup (60 frames = 1 second)

  // --- Plunger ---
  // CHANGED IN 9: 1.5 -> 1.36 seconds, so the power meter is about 10% faster. It now LOOPS: when it reaches
  // the right-hand end it starts again from the left, for as long as you hold the button.
  const CHARGE_SECONDS = 1.36;
  const ENTRY_MARGIN   = 12;
  const LAUNCH_WOBBLE  = 6;

  // --- Cups ---
  const CUP_HEIGHT    = 80;     // CHANGED IN 9: 60 -> 80, taller cups leave room for bigger pictures
  const CUP_ICON_EXTRA   = 14;     // NEW IN 9: each cup's picture is this many pixels WIDER than the cup. (0 = exactly cup width)
  const CUP_ICON_STAGGER = true;   // NEW IN 9: true = pictures alternate high/low so they can be big. false = one straight row.
  const DIVIDER_WIDTH = 4;

  // --- Walls ---
  const WALL_PEGS_REMOVED_AT_BOTTOM = 1;
  const WALL_KICK_MIN = 0;            // wall kick is OFF while both are 0
  const WALL_KICK_MAX = 0;

  // --- Money and game rules ---
  // CHANGED IN 5: all money is in dollars now.
  const STARTING_BALANCE = 20;        // dollars each new player starts with
  const STAKE            = 2;         // dollars to play one game
  const BALLS_PER_GAME   = 3;         // balls in one game
  const MAX_PLAYERS      = 5;         // NEW IN 6: most players that can sit at the machine together

  // --- Sound (NEW IN 7) ---
  const SOUND_DEFAULT_ON  = true;     // sound starts on. (After someone taps the sound button, the browser remembers their choice.)
  const SOUND_VOLUME      = 0.7;      // CHANGED IN 9 (0.5 -> 0.7): master volume, 0 (silent) to 1 (full). Everything is scaled by this.
  const SOUND_ECHO        = 0.35;     // NEW IN 9: how much room echo (reverb) is mixed in. 0 = dry and flat, 0.6 = very echoey.
  const SOUND_BIG_WIN_AT  = 20;       // a win of this many dollars or more gets the big jingle instead of the small one
  const SOUND_PEG_MIN_GAP = 0.03;     // seconds. Peg pings closer together than this are skipped, so a fast ball does not become a buzz.
  const RATCHET_STEPS     = 16;       // number of notes while winding the spring from empty to full (each plays the next note up the scale)
  const JACKPOT_START        = 100;   // the jackpot starts here, and resets here after someone wins it
  const JACKPOT_CONTRIBUTION = 1;     // dollars added to the jackpot every time a game is played
  const RESHUFFLE_EACH_GAME  = true;  // shuffle the cups at the start of every game

  // NEW IN 5: scoreboard and jackpot pile settings
  const HISTORY_GAMES  = 3;           // how many recent games per player the scoreboard remembers
  const POT_COIN_VALUE = 4;           // each drawn coin in the jackpot pile stands for this many dollars
  const POT_MAX_COINS  = 120;         // the pile stops growing after this many coins

  // PAYOUTS in dollars. (First draft numbers. We will tune them later by simulating thousands of games.)
  const PAYOUT_THREE       = { Cherry: 8, Peach: 12, Pineapple: 24, Lemon: 60 };
  const PAYOUT_WITH_STAR   = { Cherry: 3, Peach: 4, Pineapple: 8, Lemon: 20, Bell: 100 };
  const PAYOUT_THREE_STARS = 100;
  const CONSOLATION_FRUIT  = "Cherry";
  const PAYOUT_CONSOLATION = 1;
  // NEW IN 9: WINNER PLAYS AGAIN. A game that pays at least this many dollars keeps the turn with the same player.
  // The $1 consolation prize does not count (it is less than the $2 stake, so it is not really a win).
  // Set it very high (such as 9999) to switch the rule off. Three Bells (the jackpot) always ends your session.
  const KEEP_TURN_MIN_PAYOUT = 2;

  // CHANGED IN 9: "colour" is the cup's background at the top and "colourDeep" is the same colour a shade darker at the
  // bottom (a glossy candy look). The strong hot pink for the Bell is there so it stands out. The pictures come from FRUIT_SVG just below.
  const FRUITS = {
    Cherry:    { colour: "#ff9aa8", colourDeep: "#ff6f86" },
    Peach:     { colour: "#ffc27a", colourDeep: "#ff9d4a" },
    Pineapple: { colour: "#ffe65a", colourDeep: "#ffc81f" },
    Lemon:     { colour: "#c4f060", colourDeep: "#8fd62a" },
    Star:      { colour: "#8fdcff", colourDeep: "#45b4f5" },
    Bell:      { colour: "#ff2d95", colourDeep: "#d10f73", outline: true }
  };

  // NEW IN 8: THE FRUIT PICTURES.
  // Each picture is a tiny drawing written as text in a format called SVG: shapes (circles, curves, polygons)
  // with colours and a purple outline. Compared with emoji, they look identical on every phone and computer,
  // they stay sharp at any size, and they match the game's look.
  // To change a picture, edit its text. Each one is drawn on a 64 x 64 grid.
  const FRUIT_SVG = {
    Cherry: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M31 9 C30 22 24 31 19 41\" fill=\"none\" stroke=\"#4b2477\" stroke-width=\"5.2\"/><path d=\"M33 9 C35 22 42 31 45 42\" fill=\"none\" stroke=\"#4b2477\" stroke-width=\"5.2\"/><path d=\"M31 9 C30 22 24 31 19 41\" fill=\"none\" stroke=\"#7b9a2f\" stroke-width=\"2.4\"/><path d=\"M33 9 C35 22 42 31 45 42\" fill=\"none\" stroke=\"#7b9a2f\" stroke-width=\"2.4\"/><path d=\"M32 9 C38 1 49 3 54 10 C46 16 37 16 32 9Z\" fill=\"#7b9a2f\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><circle cx=\"19\" cy=\"46\" r=\"11\" fill=\"#e0243a\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><circle cx=\"45\" cy=\"47\" r=\"11\" fill=\"#e0243a\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><circle cx=\"15\" cy=\"42\" r=\"3.2\" fill=\"#fff\" opacity=\".85\"/><circle cx=\"41\" cy=\"43\" r=\"3.2\" fill=\"#fff\" opacity=\".85\"/></svg>",
    Peach: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M32 18 L31 10\" fill=\"none\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M32 19 C36 8 46 6 52 10 C48 19 40 22 32 19Z\" fill=\"#7b9a2f\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M32 16 C16 14 8 28 10 40 C12 52 22 59 32 59 C42 59 52 52 54 40 C56 28 48 14 32 16Z\" fill=\"#ff9248\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M32 17 C26 28 26 46 32 58\" fill=\"none\" stroke=\"#d9572f\" stroke-width=\"2.4\"/><ellipse cx=\"21\" cy=\"32\" rx=\"5\" ry=\"8\" fill=\"#ffc38f\" opacity=\".85\" transform=\"rotate(20 21 32)\"/></svg>",
    Pineapple: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><defs><clipPath id=\"c\"><ellipse cx=\"32\" cy=\"42\" rx=\"18\" ry=\"21\"/></clipPath></defs><path d=\"M32 25 L19 7 L27 15 L32 1 L37 15 L45 7 Z\" fill=\"#5d8a2b\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><ellipse cx=\"32\" cy=\"42\" rx=\"18\" ry=\"21\" fill=\"#f5b52e\"/><g clip-path=\"url(#c)\" stroke=\"#4b2477\" stroke-width=\"1.8\" opacity=\".85\"><path d=\"M10 28 L54 70 M10 44 L40 74 M10 12 L54 54 M54 28 L10 70 M54 44 L24 74 M54 12 L10 54\"/></g><ellipse cx=\"32\" cy=\"42\" rx=\"18\" ry=\"21\" fill=\"none\" stroke=\"#4b2477\" stroke-width=\"2.6\"/></svg>",
    Lemon: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M31 18 C32 10 40 7 46 9 C44 16 38 20 31 18Z\" fill=\"#7b9a2f\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M4 34 C9 33 12 19 32 19 C52 19 55 33 60 34 C55 36 52 50 32 50 C12 50 9 36 4 34Z\" fill=\"#fadf2e\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M16 32 C19 26 25 24 31 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" opacity=\".8\"/></svg>",
    Star: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"32.0,6.0 39.3,23.9 58.6,25.3 43.9,37.9 48.5,56.7 32.0,46.5 15.5,56.7 20.1,37.9 5.4,25.3 24.7,23.9\" fill=\"#ffd22e\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><polygon points=\"32.0,19.0 35.8,28.7 46.3,29.4 38.2,36.0 40.8,46.1 32.0,40.5 23.2,46.1 25.8,36.0 17.7,29.4 28.2,28.7\" fill=\"#fff3a6\" opacity=\".9\"/></svg>",
    Bell: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><circle cx=\"32\" cy=\"8\" r=\"4.2\" fill=\"#f2b134\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M32 9 C42 9 46 16 46 26 C46 37 51 42 55 49 L9 49 C13 42 18 37 18 26 C18 16 22 9 32 9Z\" fill=\"#ffc83d\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><ellipse cx=\"32\" cy=\"50\" rx=\"23\" ry=\"4.6\" fill=\"#e59a1a\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><circle cx=\"32\" cy=\"57\" r=\"5.2\" fill=\"#f2b134\" stroke=\"#4b2477\" stroke-width=\"2.6\"/><path d=\"M24 20 C24 15 27 13 30 12\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" opacity=\".85\"/></svg>"
  };

  // Turn each drawing into something the page can show: a "data address" (the picture written into a web address),
  // and an Image object the canvas can draw. fruitImgTag() makes the <img> text used in the pay table and the ticket.
  const FRUIT_URI = {};
  const FRUIT_IMG = {};
  for (const name in FRUIT_SVG) {
    FRUIT_URI[name] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(FRUIT_SVG[name]);
    FRUIT_IMG[name] = new Image();
    FRUIT_IMG[name].onload = function () { sceneDirty = true; };   // once a picture has loaded, repaint the cups with it
    FRUIT_IMG[name].src = FRUIT_URI[name];
  }
  function fruitImgTag(name, size) {
    return '<img class="fruit" alt="' + name + '" src="' + FRUIT_URI[name] + '" width="' + size + '" height="' + size + '">';
  }

  const CUP_RECIPE = [
    { fruit: "Cherry",    count: 3, width: 34 },
    { fruit: "Peach",     count: 3, width: 34 },
    { fruit: "Pineapple", count: 2, width: 34 },
    { fruit: "Lemon",     count: 2, width: 34 },
    { fruit: "Star",      count: 1, width: 30 },
    { fruit: "Bell",      count: 2, width: 28 }
  ];

  // ============================================================
  // 2. SETUP - the physics world
  // ============================================================
  const Engine    = Matter.Engine;
  const Bodies    = Matter.Bodies;
  const Composite = Matter.Composite;
  const Body      = Matter.Body;
  const Events    = Matter.Events;

  const engine = Engine.create();
  engine.gravity.y = GRAVITY;

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  // NEW IN 8: draw at RENDER_SCALE times the detail. The canvas gets more pixels, then ctx.scale tells the pen
  // "from now on, treat every measurement as RENDER_SCALE times bigger". All our drawing code keeps using the
  // same 400 x 650 numbers as before, but the picture has twice the detail.
  canvas.width  = BOARD_WIDTH * RENDER_SCALE;
  canvas.height = CANVAS_HEIGHT * RENDER_SCALE;
  ctx.scale(RENDER_SCALE, RENDER_SCALE);

  // ============================================================
  // 3. WALLS, FLOOR AND PEGS
  // ============================================================
  const leftWall  = Bodies.rectangle(-10, BOARD_HEIGHT / 2, 20, BOARD_HEIGHT * 2, { isStatic: true });
  const rightWall = Bodies.rectangle(BOARD_WIDTH + 10, BOARD_HEIGHT / 2, 20, BOARD_HEIGHT * 2, { isStatic: true });
  const floor     = Bodies.rectangle(BOARD_WIDTH / 2, BOARD_HEIGHT + 10, BOARD_WIDTH, 20, { isStatic: true });
  Composite.add(engine.world, [leftWall, rightWall, floor]);

  const pegs = [];
  const wallPegYs = [];

  for (let row = 0; row < PEG_ROWS; row++) {
    const shift = (row % 2 === 0) ? 0 : PEG_SPACING / 2;
    const y = FIRST_PEG_ROW_Y + row * PEG_ROW_GAP;

    for (let x = shift + PEG_SPACING / 2; x < BOARD_WIDTH; x += PEG_SPACING) {
      pegs.push(Bodies.circle(x, y, PEG_RADIUS, { isStatic: true, restitution: PEG_BOUNCE }));
    }
    if (shift !== 0) {
      wallPegYs.push(y);
    }
  }

  const wallPegsToKeep = Math.max(0, wallPegYs.length - WALL_PEGS_REMOVED_AT_BOTTOM);
  for (let i = 0; i < wallPegsToKeep; i++) {
    const y = wallPegYs[i];
    pegs.push(Bodies.circle(0, y, PEG_RADIUS, { isStatic: true, restitution: PEG_BOUNCE }));
    pegs.push(Bodies.circle(BOARD_WIDTH, y, PEG_RADIUS, { isStatic: true, restitution: PEG_BOUNCE }));
  }
  Composite.add(engine.world, pegs);

  // ============================================================
  // 4. THE CUPS
  // ============================================================
  let cups = [];
  let dividerBodies = [];
  let sceneDirty = true;     // NEW IN 8: true when the painted background + cups must be repainted (see section 13)

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = list[i];
      list[i] = list[j];
      list[j] = temp;
    }
  }

  function hasSameNeighbours(list) {
    for (let i = 1; i < list.length; i++) {
      if (list[i].fruit === list[i - 1].fruit) {
        return true;
      }
    }
    return false;
  }

  function buildCups() {
    for (const body of dividerBodies) {
      Composite.remove(engine.world, body);
    }
    dividerBodies = [];

    const slots = [];
    for (const item of CUP_RECIPE) {
      for (let n = 0; n < item.count; n++) {
        slots.push({ fruit: item.fruit, width: item.width });
      }
    }

    do {
      shuffle(slots);
    } while (hasSameNeighbours(slots));

    let totalWidth = 0;
    for (const slot of slots) {
      totalWidth = totalWidth + slot.width;
    }
    const scale = BOARD_WIDTH / totalWidth;

    cups = [];
    let x = 0;
    for (const slot of slots) {
      const w = slot.width * scale;
      cups.push({ fruit: slot.fruit, left: x, right: x + w });
      x = x + w;
    }

    for (let i = 1; i < cups.length; i++) {
      const dividerX = cups[i].left;
      const wall = Bodies.rectangle(dividerX, BOARD_HEIGHT - CUP_HEIGHT / 2, DIVIDER_WIDTH, CUP_HEIGHT,
                                    { isStatic: true, restitution: 0.3 });
      const cap  = Bodies.circle(dividerX, BOARD_HEIGHT - CUP_HEIGHT, DIVIDER_WIDTH,
                                 { isStatic: true, restitution: PEG_BOUNCE });
      dividerBodies.push(wall, cap);
    }
    Composite.add(engine.world, dividerBodies);
    sceneDirty = true;       // the cups changed, so the painted picture of them is out of date
  }

  buildCups();

  function cupAt(x) {
    for (const cup of cups) {
      if (x >= cup.left && x < cup.right) {
        return cup;
      }
    }
    return (x < 0) ? cups[0] : cups[cups.length - 1];
  }

  // ============================================================
  // 5. SAVED DATA (jackpot and scoreboard)
  // ============================================================
  // NEW IN 5: "localStorage" is a small notebook the browser keeps on this device.
  // Whatever we write there is still there after the page is closed and reopened.
  // It is only on THIS device. Sharing a jackpot between phones needs a server (that comes with multiplayer).
  //
  // "store" is the one object we save. It looks like this:
  //   { pot: 104, lastName: "Manu", lastNames: ["Manu", "Priya"], players: { "manu": { name: "Manu", games: [6, -2, -2] } } }
  // NEW IN 6: "lastNames" remembers who was playing last time, so the name boxes are filled in for you.
  // "games" holds each recent game's NET result in dollars (prize minus stake).
  const STORAGE_KEY = "frueets-v1";
  let store = { pot: JACKPOT_START, lastName: "", lastNames: [], players: {} };

  function loadStore() {
    // try/catch: if the browser refuses to let us read the notebook, carry on with a fresh one.
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (typeof data.pot === "number")        store.pot = data.pot;
        if (typeof data.lastName === "string")   store.lastName = data.lastName;
        if (Array.isArray(data.lastNames)) {
          store.lastNames = data.lastNames.filter(function (n) { return typeof n === "string"; }).slice(0, MAX_PLAYERS);
        }
        if (data.players && typeof data.players === "object") store.players = data.players;
      }
    } catch (error) {
      // nothing to do: we just start fresh
    }
  }

  function saveStore() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    } catch (error) {
      // saving failed (for example a private browsing window). The game still works, it just won't remember.
    }
  }

  loadStore();

  // Add one finished game's net result to the current player's history.
  function recordGame(net) {
    const who = me();                  // NEW IN 6: whoever's turn it is
    if (!store.players[who.key]) {
      store.players[who.key] = { name: who.name, games: [] };
    }
    const player = store.players[who.key];
    player.name = who.name;
    player.games.push(net);
    while (player.games.length > HISTORY_GAMES) {
      player.games.shift();          // forget the oldest game
    }
    saveStore();
  }

  // ============================================================
  // 6. THE MACHINE'S MEMORY
  // ============================================================
  // gameState is the "mode" the machine is in:
  //   "home"     on the home screen (name entry and scoreboard)
  //   "idle"     at the game screen, it is someone's turn and they are waiting to insert the coin
  //   "playing"  a game is in progress
  //   "result"   a game just finished, the player can carry on, pass the phone on, or cash out
  //   "gameover" this player is out of the rotation (out of coins, cashed out, or won the jackpot)
  //   "final"    NEW IN 6: everyone is finished, showing the final standings
  let gameState = "home";

  // NEW IN 6: THE TABLE. Everyone sitting at the machine, and whose turn it is.
  // Analogy: a card table. "players" is the list of seats, "current" points at whoever is playing now.
  //   players[i] = { name, key, balance, biggestWin, active }
  //   "active" stays true while a player is still in the rotation. It turns false when they are out.
  //   "started" turns true once anyone has put a coin in (until then "Back" just returns to the home screen).
  let table = { players: [], current: 0, started: false };

  // me() = the player whose turn it is. We use it everywhere instead of the old single "balance" variable.
  function me() {
    return table.players[table.current];
  }

  function activePlayers() {
    return table.players.filter(function (p) { return p.active; });
  }

  // Index of the next active player after the current one, going round the table. Returns -1 if nobody is left.
  function nextActiveIndex() {
    const count = table.players.length;
    for (let step = 1; step <= count; step++) {
      const index = (table.current + step) % count;
      if (table.players[index].active) {
        return index;
      }
    }
    return -1;
  }

  let ballsRemaining = 0;
  let results        = [];      // fruits the current game's balls landed in, e.g. ["Cherry", "Star"]

  let lastOutcome = { label: "", payout: 0 };
  let keepsTurn   = false;      // NEW IN 9: true when the game just finished won a real prize, so the same player goes again
  let outcomeKind = "none";     // NEW IN 7: which jingle to play when a game ends: "jackpot", "big", "small", "consolation" or "none" 
  let endInfo     = { title: "", line2: "", note: "" };

  let charging      = false;
  let power         = 0;
  let ball          = null;
  let ballLanded    = false;
  let reshuffleUsed = false;
  let resultText    = "";
  let overlayDelay  = 0;        // frames to wait before showing the overlay (so you see the last ball land)

  // Format dollars for display, e.g. 8 becomes "$8"
  function money(amount) {
    return "$" + amount;
  }

  // Format a win or loss with a sign, e.g. 6 becomes "+$6" and -2 becomes "-$2"
  function signed(amount) {
    if (amount > 0) return "+$" + amount;
    if (amount < 0) return "-$" + Math.abs(amount);
    return "$0";
  }

  function ballIsRolling() {
    return ball !== null && !ballLanded;
  }

  function canFire() {
    return gameState === "playing" && ballsRemaining > 0 && !ballIsRolling();
  }

  // ============================================================
  // 7. THE GAME RULES (the state machine)
  // ============================================================
  function removeBall() {
    if (ball !== null) {
      Composite.remove(engine.world, ball);
    }
    ball = null;
    ballLanded = false;
  }

  // NEW IN 5: from the home screen, sit down at the machine.
  // NEW IN 6: now we sit down with 1 to 5 players. Each gets their own balance.
  function enterGameFromHome() {
    const typed = readNames();                       // whatever is in the name boxes, in order

    // Remember the typed names for next time (exactly as typed, even if a box was left empty).
    store.lastNames = typed.map(function (n) { return n.trim(); });
    store.lastName = store.lastNames[0];
    saveStore();

    // Build the seats. Two people with the same name would share one scoreboard line,
    // so if a name repeats we add a number to it ("Sam", "Sam 2").
    const taken = {};
    table = { players: [], current: 0, started: false };
    for (let i = 0; i < typed.length; i++) {
      let name = typed[i].trim();
      if (name === "") {
        name = (typed.length === 1) ? "Player" : "Player " + (i + 1);
      }
      let finalName = name;
      let n = 2;
      while (taken[finalName.toLowerCase()]) {
        finalName = name + " " + n;
        n = n + 1;
      }
      taken[finalName.toLowerCase()] = true;
      table.players.push({
        name: finalName,
        key: finalName.toLowerCase(),
        balance: STARTING_BALANCE,
        biggestWin: 0,
        active: true
      });
    }

    ballsRemaining = 0;
    results = [];
    keepsTurn = false;
    charging = false;
    power = 0;
    removeBall();
    buildCups();
    buildPlayerStrip();
    setCelebrate(false);

    gameState = "idle";
    resultText = "";
    overlayDelay = 0;
    showScreen("game");
    updateUi();
    refreshControls();
    renderOverlay();
  }

  // NEW IN 5: back to the home screen.
  function goHome() {
    setCelebrate(false);
    gameState = "home";
    charging = false;
    power = 0;
    removeBall();
    showScreen("home");
    renderHome();
  }

  function startGame() {
    const who = me();
    if (who.balance < STAKE) return;

    who.balance = who.balance - STAKE;
    table.started = true;
    store.pot = store.pot + JACKPOT_CONTRIBUTION;     // part of the stake feeds the jackpot
    saveStore();

    ballsRemaining = BALLS_PER_GAME;
    results = [];
    keepsTurn = false;

    removeBall();
    if (RESHUFFLE_EACH_GAME) {
      buildCups();
    }
    reshuffleUsed = false;

    setCelebrate(false);
    gameState = "playing";
    resultText = "Hold the pull button for ball 1";
    updateUi();
    renderOverlay();
    soundCoinInsert();                   // NEW IN 7
  }

  function handleBallLanded(fruitName) {
    soundLand(fruitName);                // NEW IN 7
    results.push(fruitName);
    ballsRemaining = ballsRemaining - 1;

    if (results.length >= BALLS_PER_GAME) {
      finishGame();
    } else {
      resultText = fruitName + "! Now ball " + (results.length + 1);
    }
    updateUi();
  }

  function plural(fruitName) {
    if (fruitName === "Cherry") return "Cherries";
    if (fruitName === "Peach")  return "Peaches";
    return fruitName + "s";
  }

  function evaluateGame(fruits) {
    const stars  = fruits.filter(function (f) { return f === "Star"; }).length;
    const others = fruits.filter(function (f) { return f !== "Star"; });

    if (stars === 3) {
      return { payout: PAYOUT_THREE_STARS, label: "Three Stars!" };
    }

    const first = others[0];
    const allSame = others.every(function (f) { return f === first; });

    if (allSame) {
      if (stars === 0) {
        if (first === "Bell") {
          return { jackpot: true, label: "THREE BELLS!" };
        }
        return { payout: PAYOUT_THREE[first], label: "Three " + plural(first) + "!" };
      }
      return { payout: PAYOUT_WITH_STAR[first], label: "Wild Star + " + first };
    }

    const count = fruits.filter(function (f) { return f === CONSOLATION_FRUIT; }).length;
    if (count === 2) {
      return { payout: PAYOUT_CONSOLATION, label: "Two " + plural(CONSOLATION_FRUIT) };
    }

    return { payout: 0, label: "No match" };
  }

  function finishGame() {
    const who = me();
    const multi = table.players.length > 1;          // wording: "You win" for one player, "Priya wins" for several
    const outcome = evaluateGame(results);

    keepsTurn = false;                               // NEW IN 9: reset; set below if this game wins
    if (outcome.jackpot) {
      const prize = store.pot;
      who.balance = who.balance + prize;
      who.biggestWin = Math.max(who.biggestWin, prize);
      recordGame(prize - STAKE);                     // remember this game on the scoreboard
      lastOutcome = { label: outcome.label, payout: prize };
      endInfo = {
        title: "JACKPOT!",
        line2: (multi ? who.name + " emptied" : "You emptied") + " the machine and won " + money(prize) + "!",
        note: (multi ? who.name + " finishes" : "You finish") + " with " + money(who.balance)
      };
      store.pot = JACKPOT_START;                     // the machine is topped up for the next player
      saveStore();
      outcomeKind = "jackpot";                       // NEW IN 7: which jingle to play
      who.active = false;                            // three Bells ends THIS player's session. The others carry on.
      gameState = "gameover";
      resultText = "JACKPOT!";
      overlayDelay = 45;
      return;
    }

    who.balance = who.balance + outcome.payout;
    who.biggestWin = Math.max(who.biggestWin, outcome.payout);
    keepsTurn = (outcome.payout >= KEEP_TURN_MIN_PAYOUT);    // NEW IN 9: a real win means you play again
    recordGame(outcome.payout - STAKE);              // remember this game on the scoreboard
    lastOutcome = { label: outcome.label, payout: outcome.payout };

    // NEW IN 7: pick the jingle for this result
    if (outcome.payout >= SOUND_BIG_WIN_AT)        outcomeKind = "big";
    else if (outcome.payout > PAYOUT_CONSOLATION)  outcomeKind = "small";
    else if (outcome.payout > 0)                   outcomeKind = "consolation";
    else                                           outcomeKind = "none";

    if (who.balance < STAKE) {
      endInfo = {
        title: "Out of coins!",
        line2: (multi ? who.name + " finishes" : "You finish") + " with " + money(who.balance),
        note: ""
      };
      who.active = false;                            // can't afford another game, so out of the rotation
      keepsTurn = false;
      gameState = "gameover";
    } else {
      gameState = "result";
    }
    resultText = outcome.label;
    overlayDelay = 45;                               // wait about 0.75 seconds so you see the last ball land
  }

  // NEW IN 6: hand the phone to the next player who is still in.
  // The new player starts at "idle": the overlay says whose turn it is and waits for their coin.
  function advanceTurn() {
    const next = nextActiveIndex();
    if (next === -1) return;
    table.current = next;

    charging = false;
    power = 0;
    removeBall();
    results = [];                                    // fresh counters for the new player
    keepsTurn = false;
    ballsRemaining = 0;
    reshuffleUsed = false;
    resultText = "";
    overlayDelay = 0;
    setCelebrate(false);
    gameState = "idle";
    updateUi();
    renderOverlay();
    soundPass();                                     // NEW IN 7
  }

  // NEW IN 6: everyone is done. Show the final standings.
  function showFinal() {
    charging = false;
    power = 0;
    removeBall();
    gameState = "final";
    resultText = "";
    updateUi();
    renderOverlay();
    soundFanfare();                                  // NEW IN 7
  }

  // The current player leaves the rotation: "End game" for one player, "Leave table" / "Cash out" for several.
  function endGameEarly() {
    if (gameState === "home" || gameState === "gameover" || gameState === "final") return;

    // Nobody has put a coin in yet: just go back to the home screen.
    if (gameState === "idle" && !table.started) {
      goHome();
      return;
    }

    const who = me();
    const multi = table.players.length > 1;
    const forfeited = (gameState === "playing");     // were we in the middle of a game?
    if (forfeited) {
      recordGame(-STAKE);                            // the stake is lost, and the scoreboard shows it
    }
    charging = false;
    power = 0;
    removeBall();
    who.active = false;

    endInfo = {
      title: multi ? "Left the table" : "Game ended",
      line2: (multi ? who.name + " walks" : "You walk") + " away with " + money(who.balance),
      note: forfeited ? "(The game in progress was forfeited)" : ""
    };
    gameState = "gameover";
    resultText = "";
    overlayDelay = 0;
    updateUi();
    renderOverlay();
  }

  // ============================================================
  // 8. THE PLUNGER
  // ============================================================
  function powerToX(p) {
    return ENTRY_MARGIN + p * (BOARD_WIDTH - 2 * ENTRY_MARGIN);
  }

  function fireBall() {
    removeBall();
    const wobble = (Math.random() - 0.5) * 2 * LAUNCH_WOBBLE;
    ball = Bodies.circle(powerToX(power) + wobble, 40, BALL_RADIUS, {
      restitution: BALL_BOUNCE,
      friction: 0.001,
      frictionAir: BALL_AIR_RESISTANCE,
      density: 0.004
    });
    Composite.add(engine.world, ball);
    Body.setVelocity(ball, { x: (Math.random() - 0.5) * 1, y: 2 });

    ballLanded = false;
    reshuffleUsed = false;
    resultText = "...rolling...";
    updateUi();
  }

  // NEW IN 5: starting and releasing the pull are two small functions, so the finger (touch),
  // the mouse and the spacebar can all use the exact same code.
  function startCharging() {
    if (canFire()) {
      charging = true;
      power = 0;
      soundChargeStart();                // NEW IN 7
    }
  }

  function releasePull() {
    if (charging) {
      charging = false;
      soundTwang(power);                 // NEW IN 7: the spring lets go (power is read before it is reset below)
      fireBall();
      power = 0;
    }
  }

  function tryReshuffle() {
    if (gameState !== "playing") return;
    if (ballIsRolling()) {
      resultText = "Wait for the ball to land";
      return;
    }
    if (reshuffleUsed) {
      resultText = "Only one reshuffle per ball";
      return;
    }
    buildCups();
    reshuffleUsed = true;
    resultText = "Cups reshuffled!";
    soundShuffle();                      // NEW IN 7
  }

  // ============================================================
  // 8b. SOUNDS (REBUILT IN 9: a modern, bubbly "mobile game" sound set)
  // ============================================================
  // ============================================================
  // WHY make the sounds with code? There are no sound files to download or pay for, and the game stays one file.
  //
  // ANALOGY: instead of playing a recording of a band, we build a tiny band out of ingredients that the browser's
  // "Web Audio" system gives us:
  //   * an OSCILLATOR makes a steady musical note (like holding down one organ key)
  //   * a NOISE BURST makes a hiss or a swish
  //   * a GAIN is a volume knob we can turn automatically
  //   * a REVERB is the echo of a room. We send a little of every note into it, so the sounds sparkle instead of
  //     sounding flat and dry (like singing in a bathroom instead of in a wardrobe)
  // Make a note start loud and fade away fast, and you get a "plink". Add a quiet, higher, much shorter note on top
  // and the plink becomes a wooden marimba "tock". Add a bell's odd overtones and it becomes a glockenspiel.
  //
  // WHY a musical scale? Peg hits and the climbing pull-sound use the PENTATONIC scale (five notes per octave).
  // Any notes from it sound pleasant together, so the random peg hits form a happy tinkle instead of noise.
  //
  // Browsers refuse to make any sound until the person has touched the page (so websites cannot blast you
  // with noise). So the audio system is only switched on at the first tap or key press (see unlockAudio).
  // If the browser has no Web Audio at all, every sound function quietly does nothing and the game still works.
  // (On an iPhone the side "silent" switch also mutes web sounds. Flip it so the orange is hidden.)

  const SOUND_PREF_KEY = "frueets-sound";
  let soundOn = SOUND_DEFAULT_ON;
  try {
    const savedChoice = localStorage.getItem(SOUND_PREF_KEY);
    if (savedChoice === "on")  soundOn = true;
    if (savedChoice === "off") soundOn = false;
  } catch (error) {
    // cannot read the browser's notebook: use the default
  }

  let audioCtx    = null;    // the audio system (made on the first tap)
  let masterGain  = null;    // the master volume knob everything plays through
  let reverbSend  = null;    // the "room echo" input: notes send a little of themselves here
  let noiseBuffer = null;    // one second of random noise, reused for every swish
  let lastPegSound = -1;     // when the last peg note played (to stop them bunching up)

  // Turn a step on the scale into a pitch. Step 0 is middle C (262 Hz), step 5 is the C above it, step 10 the next C, and so on.
  // Between each C there are four more notes: D, E, G, A.
  const PENTATONIC = [0, 2, 4, 7, 9];     // distance in semitones (piano keys) from C
  function noteHz(step) {
    const octave = Math.floor(step / 5);
    const semitones = PENTATONIC[((step % 5) + 5) % 5] + 12 * octave;
    return 261.63 * Math.pow(2, semitones / 12);
  }

  // A made-up room echo: random noise that fades away, one second long. Played back through a "convolver",
  // it makes every note sound like it was played in a small hall.
  function makeEchoShape(seconds) {
    const length = Math.floor(audioCtx.sampleRate * seconds);
    const shape = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const samples = shape.getChannelData(channel);
      for (let i = 0; i < length; i++) {
        samples[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
      }
    }
    return shape;
  }

  function unlockAudio() {
    if (audioCtx === null) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;   // "webkit" = older Safari
      if (!AudioContextClass) return;
      try {
        audioCtx = new AudioContextClass();

        // Chain: every sound -> master volume -> a soft "limiter" -> speakers.
        // The limiter is a curve that leaves quiet sounds alone but gently rounds off very loud peaks, so a jackpot
        // full of notes can never crackle. (We tried the browser's built-in compressor, but it also made quiet sounds too soft.)
        masterGain = audioCtx.createGain();
        masterGain.gain.value = SOUND_VOLUME;
        const limiter = audioCtx.createWaveShaper();
        const curve = new Float32Array(1024);
        for (let i = 0; i < curve.length; i++) {
          const x = (i / (curve.length - 1)) * 2 - 1;      // from -1 to +1
          curve[i] = Math.tanh(1.5 * x) / 1.5;             // nearly a straight line near 0, flattening toward the ends
        }
        limiter.curve = curve;
        masterGain.connect(limiter);
        limiter.connect(audioCtx.destination);           // destination = the speakers

        // The echo: sounds -> reverbSend -> convolver (the room) -> a quieter copy -> master volume.
        reverbSend = audioCtx.createGain();
        const room = audioCtx.createConvolver();
        room.buffer = makeEchoShape(1.1);
        const roomVolume = audioCtx.createGain();
        roomVolume.gain.value = SOUND_ECHO;
        reverbSend.connect(room);
        room.connect(roomVolume);
        roomVolume.connect(masterGain);

        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
        const samples = noiseBuffer.getChannelData(0);
        for (let i = 0; i < samples.length; i++) {
          samples[i] = Math.random() * 2 - 1;            // a random number between -1 and 1 = hiss
        }
      } catch (error) {
        audioCtx = null;
        return;
      }
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function soundReady() {
    return soundOn && audioCtx !== null;
  }

  // ---- The two building blocks ----

  // One musical note. freq = pitch in Hz (higher = squeakier). duration in seconds.
  // options: type ("sine" is smooth and pure, "triangle" is a bit brighter), volume, endFreq (slide the pitch to this),
  //          delay (start this many seconds from now), attack (fade-in time), echo (0 to 1: how much goes to the room echo).
  function tone(freq, duration, options) {
    if (!soundReady()) return;
    const o = options || {};
    const start = audioCtx.currentTime + (o.delay || 0);
    const volume = (o.volume === undefined) ? 0.3 : o.volume;
    const echo = (o.echo === undefined) ? 0.3 : o.echo;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(freq, start);
    if (o.endFreq) {
      osc.frequency.exponentialRampToValueAtTime(o.endFreq, start + duration);
    }
    // The volume shape: silent, quickly up to full, then fading away. (0.0001 not 0, because the maths of
    // "exponential" fades cannot reach exactly zero.)
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + (o.attack || 0.005));
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

    osc.connect(gain);
    gain.connect(masterGain);
    if (echo > 0 && reverbSend !== null) {
      const send = audioCtx.createGain();
      send.gain.value = echo;
      gain.connect(send);
      send.connect(reverbSend);
    }
    osc.start(start);
    osc.stop(start + duration + 0.05);
  }

  // A burst of hiss. A "filter" keeps only part of it: "bandpass" keeps a band around freq (a swish or a tick),
  // "lowpass" keeps only the low rumble (a soft thump). options: filter, freq, endFreq (sweep the band to this
  // pitch, for a "whoosh"), q (how narrow the band is), volume, delay.
  function noise(duration, options) {
    if (!soundReady()) return;
    const o = options || {};
    const start = audioCtx.currentTime + (o.delay || 0);
    const volume = (o.volume === undefined) ? 0.3 : o.volume;

    const source = audioCtx.createBufferSource();
    source.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = o.filter || "bandpass";
    filter.frequency.setValueAtTime(o.freq || 2000, start);
    if (o.endFreq) {
      filter.frequency.exponentialRampToValueAtTime(o.endFreq, start + duration);
    }
    filter.Q.value = o.q || 1;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    source.start(start, Math.random() * 0.5);          // start at a random spot in the noise so no two swishes are identical
    source.stop(start + duration + 0.02);
  }

  // ---- The "instruments", built from the blocks ----

  // A MARIMBA: a soft wooden note. The main note rings, and a much higher note an instant long adds the "tock".
  function mallet(freq, duration, volume, delay) {
    tone(freq,     duration, { type: "sine", volume: volume,        delay: delay || 0, attack: 0.004, echo: 0.3 });
    tone(freq * 4, 0.06,     { type: "sine", volume: volume * 0.35, delay: delay || 0, attack: 0.002, echo: 0.1 });
  }

  // A GLOCKENSPIEL: a sparkly bell. Bells ring several notes that are NOT neat multiples of each other.
  // The ratios 2.76 and 5.4 are what give it that glassy shimmer.
  function glock(freq, duration, volume, delay) {
    tone(freq,        duration,       { type: "sine", volume: volume,        delay: delay || 0, echo: 0.5 });
    tone(freq * 2.76, duration * 0.4, { type: "sine", volume: volume * 0.25, delay: delay || 0, echo: 0.5 });
    tone(freq * 5.4,  duration * 0.2, { type: "sine", volume: volume * 0.10, delay: delay || 0, echo: 0.3 });
  }

  // A BUBBLE POP: a short note whose pitch slides quickly upward, like a bubble bursting.
  function pop(freq, volume, delay) {
    tone(freq, 0.09, { type: "sine", volume: volume, endFreq: freq * 1.9, delay: delay || 0, echo: 0.15 });
  }

  // A shower of sparkles: many tiny glass notes at random high pitches, spread over "seconds".
  function sparkleShower(count, seconds, volume) {
    for (let i = 0; i < count; i++) {
      glock(noteHz(10 + Math.floor(Math.random() * 8)), 0.35, volume, (i / count) * seconds + Math.random() * 0.05);
    }
  }

  // A run of notes up the scale: steps is a list of scale steps, gap is the time between notes.
  function run(steps, gap, volume, delay) {
    steps.forEach(function (step, i) {
      mallet(noteHz(step), 0.35, volume, (delay || 0) + i * gap);
      glock(noteHz(step + 5), 0.45, volume * 0.5, (delay || 0) + i * gap);
    });
  }

  // ---- The plunger ----
  function soundChargeStart() {
    lastRatchetStep = 0;
    pop(520, 0.14);
  }

  // While you hold the button, each notch of the power meter plays the next note up the scale, like running a finger
  // up a xylophone. (When the meter loops back to the start, so does the tune.)
  let lastRatchetStep = 0;
  function soundWhileCharging() {
    const step = Math.floor(power * RATCHET_STEPS);
    if (step !== lastRatchetStep) {
      lastRatchetStep = step;
      mallet(noteHz(step), 0.16, 0.10);
    }
  }

  // Letting go: a stretchy rubber "thwip" (a quick pitch drop), a pop, and a whoosh as the ball flies off.
  function soundTwang(strength) {
    if (!soundReady()) return;
    tone(500 + strength * 500, 0.22, { type: "sine", endFreq: 160, volume: 0.30, echo: 0.2 });
    tone(250 + strength * 150, 0.16, { type: "triangle", endFreq: 600, volume: 0.10, delay: 0.02, echo: 0.1 });
    noise(0.32, { freq: 2600, endFreq: 500, q: 0.9, volume: 0.16 });      // the whoosh sweeps from high to low
    pop(300, 0.18, 0.01);
  }

  // ---- The ball hitting things ----
  // speed is how fast the ball is moving (harder hits are louder). y is how far down the board the peg is:
  // the notes step DOWN the scale as the ball falls, so a falling ball plays a little tumbling tune.
  function soundPeg(speed, y) {
    if (!soundReady()) return;
    const now = audioCtx.currentTime;
    if (now - lastPegSound < SOUND_PEG_MIN_GAP) return;
    lastPegSound = now;
    const volume = Math.min(0.16, 0.04 + speed * 0.012);
    const row = (y === undefined) ? 2 : (y - FIRST_PEG_ROW_Y) / PEG_ROW_GAP;        // 0 at the top peg row ... about 4 at the last
    const step = 14 - Math.round(row * 1.5) + Math.floor(Math.random() * 3) - 1;    // wobble by one note either way
    mallet(noteHz(step), 0.22, volume);
  }

  function soundThud(speed) {
    const volume = Math.min(0.22, 0.06 + speed * 0.014);
    tone(210, 0.08, { endFreq: 120, volume: volume, echo: 0.05 });
    noise(0.04, { filter: "lowpass", freq: 500, volume: volume * 0.7 });
  }

  // The ball dropping into a cup: a soft "bloop", then a note that depends on the fruit (so you can hear which one
  // you got). A Bell cup rings like a glockenspiel and a Star cup sparkles.
  const LAND_STEP = { Cherry: 7, Peach: 8, Pineapple: 9, Lemon: 10, Star: 12, Bell: 14 };
  function soundLand(fruitName) {
    if (!soundReady()) return;
    tone(380, 0.14, { endFreq: 150, volume: 0.30, echo: 0.1 });
    noise(0.08, { filter: "lowpass", freq: 450, volume: 0.18 });
    const step = LAND_STEP[fruitName] || 8;
    if (fruitName === "Bell") {
      glock(noteHz(step), 1.0, 0.24, 0.04);
      glock(noteHz(step + 2), 1.0, 0.18, 0.16);
    } else if (fruitName === "Star") {
      [12, 14, 15, 17].forEach(function (s, i) {
        glock(noteHz(s), 0.4, 0.16, 0.04 + i * 0.06);
      });
    } else {
      mallet(noteHz(step), 0.45, 0.26, 0.03);
    }
  }

  // ---- Money and turns ----
  function soundCoinInsert() {
    pop(700, 0.18);
    glock(noteHz(12), 0.3, 0.16, 0.07);       // a quick two-note "ka-ching"
    glock(noteHz(15), 0.5, 0.16, 0.14);
  }

  function soundShuffle() {
    for (let i = 0; i < 6; i++) {
      pop(380 + i * 80 + Math.random() * 40, 0.09, i * 0.05);
    }
  }

  function soundPass() {
    glock(noteHz(10), 0.5, 0.2, 0);          // a friendly two-note "ding-dong"
    glock(noteHz(12), 0.7, 0.2, 0.14);
  }

  function soundFanfare() {
    run([5, 7, 9, 10, 12, 14], 0.1, 0.2, 0);
    [10, 12, 14, 17].forEach(function (s) {                  // then a big shining chord
      glock(noteHz(s), 1.4, 0.16, 0.75);
    });
    tone(131, 1.4, { type: "triangle", volume: 0.12, delay: 0.75, attack: 0.1, echo: 0.2 });
    sparkleShower(14, 1.5, 0.08);
  }

  function soundClick() {
    pop(820, 0.07);
  }

  // ---- The end-of-game jingles ----
  // outcomeKind is set by finishGame. We play the jingle at the moment the result card appears.
  function playOutcomeSound() {
    if (!soundReady()) return;

    if (outcomeKind === "jackpot") {
      // Three rising waves of notes, a huge chord, a deep swell, and a shower of sparkles.
      for (let wave = 0; wave < 3; wave++) {
        run([5, 7, 9, 10, 12, 14, 15, 17, 19], 0.065, 0.2, wave * 0.8);
      }
      [10, 12, 14, 17, 19].forEach(function (s) {
        glock(noteHz(s), 2.2, 0.18, 2.4);
      });
      tone(131, 2.2, { type: "triangle", volume: 0.14, delay: 2.4, attack: 0.2, echo: 0.2 });
      tone(196, 2.2, { type: "triangle", volume: 0.10, delay: 2.4, attack: 0.2, echo: 0.2 });
      noise(1.2, { freq: 600, endFreq: 5000, q: 0.8, volume: 0.10, delay: 1.5 });     // a rising "whoosh"
      sparkleShower(90, 3.6, 0.07);
    } else if (outcomeKind === "big") {
      run([5, 7, 9, 10, 12, 14, 15], 0.085, 0.2, 0);
      [10, 12, 14].forEach(function (s) {
        glock(noteHz(s), 1.0, 0.16, 0.7);
      });
      sparkleShower(24, 1.6, 0.08);
    } else if (outcomeKind === "small") {
      run([7, 9, 10], 0.1, 0.2, 0);
      sparkleShower(6, 0.5, 0.08);
    } else if (outcomeKind === "consolation") {
      glock(noteHz(12), 0.6, 0.2, 0);
    } else {
      // No win: a soft, sympathetic "aww", two notes sliding down. Gentle, not harsh.
      tone(392, 0.30, { type: "sine", endFreq: 330, volume: 0.22, echo: 0.2 });
      tone(330, 0.55, { type: "sine", endFreq: 233, volume: 0.22, delay: 0.26, echo: 0.2 });
    }

    // Winning a real prize earns another turn: a cheerful rising "whoosh-ding" says so.
    if (keepsTurn) {
      noise(0.35, { freq: 500, endFreq: 4000, q: 0.8, volume: 0.10, delay: 0.5 });
      glock(noteHz(17), 0.6, 0.18, 0.8);
    }
  }

  // ---- The sound on/off button ----
  function refreshSoundButtons() {
    document.getElementById("muteBtnHome").textContent = soundOn ? "Sound: on" : "Sound: off";
    const gameBtn = document.getElementById("muteBtnGame");
    gameBtn.textContent = soundOn ? "Sound: on" : "Sound: off";
    gameBtn.setAttribute("aria-label", soundOn ? "Sound is on. Tap to turn off." : "Sound is off. Tap to turn on.");
  }

  function toggleSound() {
    soundOn = !soundOn;
    try {
      localStorage.setItem(SOUND_PREF_KEY, soundOn ? "on" : "off");
    } catch (error) {
      // could not save the choice. It still works until the page closes.
    }
    refreshSoundButtons();
    if (soundOn) {
      unlockAudio();
      soundClick();        // a little pop so you can hear that the sound is back
    }
  }

  // ============================================================
  // 9. THE WALL KICK (switched off by default, see settings)
  // ============================================================
  function kickBall(direction) {
    if (WALL_KICK_MAX <= 0) return;
    const sideways = WALL_KICK_MIN + Math.random() * (WALL_KICK_MAX - WALL_KICK_MIN);
    Body.setVelocity(ball, { x: direction * sideways, y: ball.velocity.y * 0.3 });
  }

  Events.on(engine, "collisionStart", function (event) {
    for (const pair of event.pairs) {
      const a = pair.bodyA;
      const b = pair.bodyB;
      if (a !== ball && b !== ball) continue;
      const other = (a === ball) ? b : a;

      // NEW IN 7: a sound for whatever the ball just hit.
      if (pegs.includes(other)) {
        soundPeg(ball.speed, other.position.y);
      } else if (other === leftWall || other === rightWall || other === floor || dividerBodies.includes(other)) {
        soundThud(ball.speed);
      }

      if (other === leftWall)  kickBall(+1);
      if (other === rightWall) kickBall(-1);
    }
  });

  // ============================================================
  // 10. WORKING OUT WHERE THE BALL LANDED
  // ============================================================
  function checkLanding() {
    if (ball === null || ballLanded) return;

    const atBottom = ball.position.y > BOARD_HEIGHT - BALL_RADIUS - 6;
    const nearlyStill = ball.speed < 0.5;

    if (atBottom && nearlyStill) {
      ballLanded = true;
      const cup = cupAt(ball.position.x);
      handleBallLanded(cup.fruit);
    }
  }

  let landedFrames = 0;
  function clearLandedBall() {
    if (ball === null || !ballLanded) {
      landedFrames = 0;
      return;
    }
    landedFrames = landedFrames + 1;
    if (landedFrames > BALL_CLEAR_FRAMES) {
      removeBall();
      landedFrames = 0;
    }
  }

  let stuckFrames = 0;
  function rescueIfStuck() {
    if (ball === null || ballLanded) return;
    if (ball.speed < 0.1) {
      stuckFrames = stuckFrames + 1;
    } else {
      stuckFrames = 0;
    }
    if (stuckFrames > 90) {
      Body.setVelocity(ball, { x: (Math.random() - 0.5) * 3, y: -1 });
      stuckFrames = 0;
    }
  }

  // ============================================================
  // 11. THE PAGE (screens, ticket, scoreboard, jackpot pile)
  // ============================================================
  // "document.getElementById" finds a piece of the web page by its id.
  // We look each one up once here and keep it in a variable.
  const screenHome    = document.getElementById("screenHome");
  const screenGame    = document.getElementById("screenGame");
  const nameRowsEl    = document.getElementById("nameRows");
  const addPlayerBtn  = document.getElementById("addPlayerBtn");
  const playersEl     = document.getElementById("players");
  const ticketLabelEl = document.getElementById("ticketLabel");
  const startBtn      = document.getElementById("startBtn");
  const startHint     = document.getElementById("startHint");
  const scoreboardEl  = document.getElementById("scoreboard");
  const slotsEl       = document.getElementById("slots");
  const overlayEl     = document.getElementById("overlay");
  const ovTitle       = document.getElementById("ovTitle");
  const ovLines       = document.getElementById("ovLines");
  const ovPrimary     = document.getElementById("ovPrimary");
  const ovSecondary   = document.getElementById("ovSecondary");
  const statusEl      = document.getElementById("status");
  const gaugeFill     = document.getElementById("gaugeFill");
  const pullBtn       = document.getElementById("pullBtn");
  const reshuffleBtn  = document.getElementById("reshuffleBtn");
  const endBtn        = document.getElementById("endBtn");
  const payModal      = document.getElementById("payModal");

  // Show one screen and hide the other. ("classList.toggle" adds or removes the word "hidden" on the element.)
  function showScreen(name) {
    screenHome.classList.toggle("hidden", name !== "home");
    screenGame.classList.toggle("hidden", name !== "game");
    fitBoard();   // the game screen was hidden (size 0) until now, so measure again
  }
