  // NEW IN 5b: make the frame exactly the same shape as the board picture.
  // Analogy: a picture frame bought off the shelf only looks right if it matches
  // the photo's shape. Here we cut the frame to measure every time the window changes.
  function fitBoard() {
    const area = document.getElementById("boardArea");
    const frame = document.getElementById("boardWrap");
    // Ask the page how thick the frame border is (set in the CSS on #boardWrap), instead of hard-coding it.
    const FRAME_BORDER = parseFloat(window.getComputedStyle(frame).borderLeftWidth) || 0;
    const cs = window.getComputedStyle(area);
    const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const availableW = area.clientWidth - padX - 2 * FRAME_BORDER;
    const availableH = area.clientHeight - padY - 2 * FRAME_BORDER;
    if (availableW <= 0 || availableH <= 0) {
      return;                                            // screen is hidden right now, nothing to measure
    }
    // How much can we scale the 400 x 650 board before it hits either edge?
    const scale = Math.min(availableW / BOARD_WIDTH, availableH / CANVAS_HEIGHT);
    frame.style.width = Math.floor(BOARD_WIDTH * scale) + "px";
    frame.style.height = Math.floor(CANVAS_HEIGHT * scale) + "px";
  }
  window.addEventListener("resize", fitBoard);
  window.addEventListener("orientationchange", fitBoard);
  if (window.ResizeObserver) {
    // Also re-fit if the space changes for any other reason (for example the phone's address bar sliding away).
    new ResizeObserver(fitBoard).observe(document.getElementById("boardArea"));
  }

  // CHANGED IN 9: after a win the frame gives one happy bounce (the CSS class 'celebrate'). No more flashing bulbs.
  function setCelebrate(on) {
    document.getElementById("boardWrap").classList.toggle("celebrate", on);
  }

  // Only change an element's text if it is different. This keeps things smooth, because we call it 60 times a second.
  function setText(element, text) {
    if (element.textContent !== text) {
      element.textContent = text;
    }
  }

  // ---- The jackpot pile of coins ----
  // Each coin is a gold oval. The number of coins is the pot divided by POT_COIN_VALUE.
  // Coins are laid in a triangle: a long bottom row, then a shorter one on top of it, and so on.
  // A fixed coin size means the pile really does get bigger as the pot grows.
  function drawCoin(c, x, y, radiusX, radiusY) {
    c.beginPath();
    c.ellipse(x, y, radiusX, radiusY, 0, 0, Math.PI * 2);
    c.fillStyle = "#f4c430";
    c.fill();
    c.lineWidth = 1;
    c.strokeStyle = "#5a3a0a";
    c.stroke();
    // a lighter ring inside, so it looks like a coin and not a blob
    c.beginPath();
    c.ellipse(x, y - radiusY * 0.1, radiusX * 0.6, radiusY * 0.5, 0, 0, Math.PI * 2);
    c.strokeStyle = "rgba(255, 255, 255, 0.5)";
    c.stroke();
  }

  function drawPotPile(cv, amount) {
    const c = cv.getContext("2d");
    c.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);   // NEW IN 8: sharp on phone screens (see sharpenPotCanvases)
    const w = cv.width / RENDER_SCALE;
    const h = cv.height / RENDER_SCALE;
    c.clearRect(0, 0, w, h);

    const coins = Math.max(3, Math.min(POT_MAX_COINS, Math.round(amount / POT_COIN_VALUE)));

    // How long must the bottom row be so the triangle holds all the coins?
    // A triangle with a bottom row of n coins holds n + (n-1) + ... + 1 coins. This formula solves that for n.
    const baseRow = Math.ceil((Math.sqrt(8 * coins + 1) - 1) / 2);

    const coinWidth  = w / 16;               // fixed size, so the pile visibly grows
    const coinHeight = coinWidth * 0.5;
    const rowStep    = coinHeight * 0.8;     // rows overlap a little, like a real pile

    let drawn = 0;
    for (let row = 0; drawn < coins; row++) {
      const inThisRow = baseRow - row;
      const rowWidth  = inThisRow * coinWidth;
      const startX    = (w - rowWidth) / 2 + coinWidth / 2;
      const y         = h - coinHeight / 2 - 3 - row * rowStep;
      for (let i = 0; i < inThisRow && drawn < coins; i++) {
        drawCoin(c, startX + i * coinWidth, y, coinWidth / 2, coinHeight / 2);
        drawn = drawn + 1;
      }
    }
  }

  // NEW IN 8: give the two jackpot-pile canvases extra pixels, like the board, so the coins are crisp on phones.
  // Their on-screen size is fixed in the CSS, so more pixels just means more detail.
  function sharpenPotCanvases() {
    for (const id of ["potBig", "potMini"]) {
      const cv = document.getElementById(id);
      cv.width  = cv.width * RENDER_SCALE;
      cv.height = cv.height * RENDER_SCALE;
    }
  }

  function updatePots() {
    drawPotPile(document.getElementById("potBig"), store.pot);
    drawPotPile(document.getElementById("potMini"), store.pot);
    setText(document.getElementById("potBigAmount"), money(store.pot));
    setText(document.getElementById("potMiniAmount"), money(store.pot));
  }

  // ---- The ticket (three counters that turn into fruit) ----
  function buildSlots() {
    slotsEl.innerHTML = "";
    for (let i = 0; i < BALLS_PER_GAME; i++) {
      const slot = document.createElement("div");
      slot.className = "slot counter";
      slot.textContent = i + 1;
      slotsEl.appendChild(slot);
    }
  }

  function updateSlots() {
    const slotEls = slotsEl.children;
    for (let i = 0; i < slotEls.length; i++) {
      if (i < results.length) {
        // This ball has been played: show the fruit picture. (We only rebuild the picture when the fruit changes.)
        slotEls[i].className = "slot filled";
        if (slotEls[i].getAttribute("data-fruit") !== results[i]) {
          slotEls[i].setAttribute("data-fruit", results[i]);
          slotEls[i].innerHTML = fruitImgTag(results[i], 44);
        }
      } else {
        // Not played yet: a purple counter with its number. The next ball to be played gets a glow.
        const isNext = (gameState === "playing" && i === results.length);
        slotEls[i].className = "slot counter" + (isNext ? " current" : "");
        if (slotEls[i].hasAttribute("data-fruit")) {
          slotEls[i].removeAttribute("data-fruit");
        }
        setText(slotEls[i], String(i + 1));
      }
    }
  }

  // ---- NEW IN 6: the players strip at the top of the game screen ----
  // buildPlayerStrip makes one little card per player (once, when the table is set up).
  // updatePlayerStrip then only changes the words and the highlight.
  function buildPlayerStrip() {
    playersEl.innerHTML = "";
    const multi = table.players.length > 1;
    playersEl.classList.toggle("solo", !multi);
    // Layout trick: five chips need the full width of the screen to fit their names. So with several players
    // the little jackpot pile hops from the top bar into the ticket card, where there is spare room. Alone, it stays put.
    // (appendChild on an element that is already in the page MOVES it.)
    // NEW IN 9: with ONE player the name and balance also hop into the ticket row and the top bar disappears (one row less,
    // so the board can be taller). With several players the strip stays on top, full width.
    const topbar = document.querySelector(".topbar");
    const ticket = document.getElementById("ticket");
    if (multi) {
      topbar.insertBefore(playersEl, topbar.firstChild);
      topbar.classList.remove("hidden");
      ticketLabelEl.classList.remove("hidden");
      ticket.appendChild(document.querySelector(".potMini"));
    } else {
      ticket.insertBefore(playersEl, ticketLabelEl);
      topbar.classList.add("hidden");
      ticketLabelEl.classList.add("hidden");
      ticket.appendChild(document.querySelector(".potMini"));
    }
    for (let i = 0; i < table.players.length; i++) {
      const chip = document.createElement("div");
      chip.className = "pChip";
      const nameEl = document.createElement("span");
      nameEl.className = "pName";
      const balEl = document.createElement("b");
      balEl.className = "pBal";
      chip.appendChild(nameEl);
      chip.appendChild(balEl);
      playersEl.appendChild(chip);
    }
  }

  function updatePlayerStrip() {
    const chips = playersEl.children;
    for (let i = 0; i < chips.length; i++) {
      const p = table.players[i];
      const isTurn = (i === table.current && p.active && gameState !== "final");
      const wanted = "pChip" + (isTurn ? " current" : "") + (p.active ? "" : " out");
      if (chips[i].className !== wanted) {
        chips[i].className = wanted;
      }
      setText(chips[i].children[0], p.name);
      setText(chips[i].children[1], money(p.balance));
    }
  }

  function updateUi() {
    if (table.players.length === 0) return;          // nobody is seated yet (home screen)
    const multi = table.players.length > 1;
    setText(ticketLabelEl, multi ? me().name + "'s " + BALLS_PER_GAME + " balls" : "Your " + BALLS_PER_GAME + " balls");
    setText(endBtn, multi ? "Leave table" : "End game");
    updatePlayerStrip();
    updateSlots();
    updatePots();
    refreshControls();   // keep the pull button and status line in step with the new state straight away
  }

  // ---- The scoreboard on the home screen ----
  // Each player shows their last few games as little coloured chips, plus the total.
  // Players with the best total are at the top.
  function renderScoreboard() {
    scoreboardEl.innerHTML = "";

    const list = [];
    for (const key in store.players) {
      const player = store.players[key];
      if (player.games.length > 0) {
        let total = 0;
        for (const g of player.games) {
          total = total + g;
        }
        list.push({ name: player.name, games: player.games, total: total });
      }
    }

    if (list.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No games yet. Be the first!";
      scoreboardEl.appendChild(empty);
      return;
    }

    list.sort(function (a, b) { return b.total - a.total; });   // best total first

    function colourFor(n) {
      return n > 0 ? "win" : (n < 0 ? "lose" : "even");
    }

    // We build each piece with createElement and textContent (not by gluing text into HTML),
    // so a player who types odd characters as a name cannot break the page.
    for (let i = 0; i < list.length; i++) {
      const entry = list[i];
      const row = document.createElement("div");
      row.className = "sbRow";

      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = i + 1;

      const name = document.createElement("span");
      name.className = "sbName";
      name.textContent = entry.name;

      const chips = document.createElement("span");
      chips.className = "chips";
      for (const g of entry.games) {
        const chip = document.createElement("i");
        chip.className = "chip " + colourFor(g);
        chip.textContent = signed(g);
        chips.appendChild(chip);
      }

      const total = document.createElement("b");
      total.className = "sbTotal " + colourFor(entry.total);
      total.textContent = signed(entry.total);

      row.appendChild(rank);
      row.appendChild(name);
      row.appendChild(chips);
      row.appendChild(total);
      scoreboardEl.appendChild(row);
    }
  }

  // ---- NEW IN 6: the name boxes on the home screen ----
  // readNames gives back what is typed in every box. buildNameRows draws the boxes from a list of names.
  function readNames() {
    const boxes = nameRowsEl.querySelectorAll("input");
    const names = [];
    for (const box of boxes) {
      names.push(box.value);
    }
    return names;
  }

  function buildNameRows(names) {
    nameRowsEl.innerHTML = "";
    names.forEach(function (name, index) {
      const row = document.createElement("div");
      row.className = "nameRow";

      const box = document.createElement("input");
      box.className = "nameInput";
      box.id = "nameInput" + index;
      box.maxLength = 12;
      box.autocomplete = "off";
      box.placeholder = (names.length === 1) ? "Type your name" : "Player " + (index + 1);
      box.value = name;
      row.appendChild(box);

      if (names.length > 1) {
        const remove = document.createElement("button");
        remove.className = "removeBtn";
        remove.textContent = "\u2715";
        remove.setAttribute("aria-label", "Remove player " + (index + 1));
        remove.addEventListener("click", function () {
          const current = readNames();
          current.splice(index, 1);               // take this one name out of the list
          buildNameRows(current);
        });
        row.appendChild(remove);
      }
      nameRowsEl.appendChild(row);
    });

    addPlayerBtn.classList.toggle("hidden", names.length >= MAX_PLAYERS);
    startBtn.textContent = (names.length === 1) ? "Play" : "Start (" + names.length + " players)";
    setText(startHint, "Everyone starts with " + money(STARTING_BALANCE) + ". A game costs " + money(STAKE) + " for " + BALLS_PER_GAME + " balls." +
      (names.length > 1 ? " Players take turns, one game each." : ""));
  }

  function renderHome() {
    let names = store.lastNames.slice(0, MAX_PLAYERS);
    if (names.length === 0) {
      names = [store.lastName];                    // older saved data only knew one name
    }
    buildNameRows(names);
    renderScoreboard();
    updatePots();
  }

  // ---- The overlay (messages and buttons on top of the board) ----
  // Returns what the overlay should say for the current mode.
  function overlayContent() {
    if (table.players.length === 0) return null;
    const who = me();
    const multi = table.players.length > 1;

    if (gameState === "idle") {
      return {
        title: multi ? who.name + "'s turn" : "Hi " + who.name + "!",
        lines: ["You have " + money(who.balance), "A game is " + money(STAKE) + " for " + BALLS_PER_GAME + " balls"],
        primary: "Insert " + money(STAKE),
        secondary: table.started ? "Leave table" : "Back"
      };
    }
    if (gameState === "result") {
      const next = nextActiveIndex();
      const othersIn = activePlayers().length > 1;   // is anyone besides this player still playing?
      // NEW IN 9: a real win keeps the turn. The big button says "Play again" and the phone is NOT passed on.
      if (keepsTurn) {
        return {
          title: lastOutcome.label,
          lines: [
            (multi ? who.name + " won " : "You won ") + money(lastOutcome.payout) + "!",
            (multi ? who.name + " plays again" : "Play again!") + "  (balance " + money(who.balance) + ")"
          ],
          primary: "Play again (" + money(STAKE) + ")",
          secondary: multi ? "Leave table" : "Cash out"
        };
      }
      return {
        title: lastOutcome.label,
        lines: [
          lastOutcome.payout > 0 ? (multi ? who.name + " won " : "You won ") + money(lastOutcome.payout) : "No win this time",
          "Balance " + money(who.balance)
        ],
        primary: othersIn ? "Pass to " + table.players[next].name : "Next game (" + money(STAKE) + ")",
        secondary: multi ? "Leave table" : "Cash out"
      };
    }
    if (gameState === "gameover") {
      const lines = [endInfo.line2];
      if (endInfo.note !== "") {
        lines.push(endInfo.note);
      }
      lines.push("Biggest win: " + money(who.biggestWin));
      let primary = "See scoreboard";
      if (activePlayers().length > 0) {
        primary = "Pass to " + table.players[nextActiveIndex()].name;
      } else if (multi) {
        primary = "Final standings";
      }
      return { title: endInfo.title, lines: lines, primary: primary, secondary: "" };
    }
    if (gameState === "final") {
      // Rank everyone by what they finished with. (sort on a copy, so the seating order is not disturbed)
      const ranked = table.players.slice().sort(function (a, b) { return b.balance - a.balance; });
      const lines = ranked.map(function (p, i) {
        return (i === 0 ? "\u2605 " : (i + 1) + ". ") + p.name + "  " + money(p.balance) +
               "  (" + signed(p.balance - STARTING_BALANCE) + ")";
      });
      return { title: "Final standings", lines: lines, primary: "See scoreboard", secondary: "" };
    }
    return null;   // while playing there is no overlay
  }

  function renderOverlay() {
    const content = overlayContent();
    if (content === null) {
      overlayEl.classList.add("hidden");
      return;
    }
    overlayEl.classList.remove("hidden");
    ovTitle.textContent = content.title;
    ovLines.innerHTML = "";
    for (const line of content.lines) {
      const div = document.createElement("div");
      div.textContent = line;
      ovLines.appendChild(div);
    }
    ovPrimary.textContent = content.primary;
    ovSecondary.textContent = content.secondary;
    ovSecondary.classList.toggle("hidden", content.secondary === "");
  }

  // What the big button and the small button on the overlay do, depending on the mode.
  function primaryAction() {
    if (gameState === "idle") {
      startGame();
    } else if (gameState === "result") {
      // NEW IN 9: a winner plays again. Otherwise: others still in? Pass the phone. If not, this player just keeps going.
      if (keepsTurn) startGame();
      else if (activePlayers().length > 1) advanceTurn();
      else startGame();
    } else if (gameState === "gameover") {
      if (activePlayers().length > 0) advanceTurn();
      else if (table.players.length > 1) showFinal();
      else goHome();
    } else if (gameState === "final") {
      goHome();
    }
  }
  function secondaryAction() {
    // "Back" (before anyone has played) and "Leave table" / "Cash out" are all handled by endGameEarly.
    if (gameState === "idle" || gameState === "result") endGameEarly();
  }

  // ---- The pay table (built from the payout settings, so it can never be out of date) ----
  function buildPayTable() {
    function row(label, value) {
      return "<tr><td>" + label + "</td><td>" + value + "</td></tr>";
    }
    function heading(text) {
      return "<tr><th colspan='2'>" + text + "</th></tr>";
    }

    // NEW IN 8: pictures instead of emoji. pics("Cherry", 3) gives three cherry pictures in a row.
    function pics(name, count) {
      let out = "";
      for (let i = 0; i < count; i++) {
        out = out + fruitImgTag(name, 28);
      }
      return out;
    }
    let html = "<table>";

    html = html + heading("Three of a kind");
    for (const fruit in PAYOUT_THREE) {
      html = html + row(pics(fruit, 3), money(PAYOUT_THREE[fruit]));
    }
    html = html + row(pics("Bell", 3), "JACKPOT " + money(store.pot));
    html = html + row(pics("Star", 3), money(PAYOUT_THREE_STARS));

    html = html + heading("With a wild card " + fruitImgTag("Star", 22));
    for (const fruit in PAYOUT_WITH_STAR) {
      html = html + row(pics("Star", 1) + pics(fruit, 2), money(PAYOUT_WITH_STAR[fruit]));
    }

    html = html + heading("Consolation");
    html = html + row(pics(CONSOLATION_FRUIT, 2) + " <span class='plain'>+ anything else</span>", money(PAYOUT_CONSOLATION));

    html = html + "</table>";
    // NEW IN 9: the new rule, in words (built from the setting so it can never be out of date)
    html = html + "<div class='hint' style='margin-top:12px'>Win " + money(KEEP_TURN_MIN_PAYOUT) + " or more and you play again!</div>";
    document.getElementById("payTable").innerHTML = html;
  }

  function openPayTable() {
    buildPayTable();
    payModal.classList.remove("hidden");
  }
  function closePayTable() {
    payModal.classList.add("hidden");
  }

  // ---- Things that must be refreshed 60 times a second ----
  function refreshControls() {
    // NEW IN 9: the meter is a full rainbow that we reveal from the left. clip-path 'inset' hides the right-hand part.
    gaugeFill.style.clipPath = "inset(0 " + ((1 - power) * 100) + "% 0 0)";

    // The pull button's words and look depend on what is allowed right now.
    let label;
    if (charging) {
      label = "Release!";
    } else if (gameState === "playing" && ballIsRolling()) {
      label = "Ball rolling...";
    } else if (gameState === "playing") {
      label = "Hold to pull";
    } else {
      label = "Insert coin to play";
    }
    setText(pullBtn, label);
    pullBtn.classList.toggle("disabled", !(canFire() || charging));
    pullBtn.classList.toggle("charging", charging);          // NEW IN 8: the button sinks while you hold it

    // The reshuffle button is only usable between balls, once per ball.
    const canReshuffle = (gameState === "playing" && !ballIsRolling() && !reshuffleUsed);
    reshuffleBtn.classList.toggle("disabled", !canReshuffle);

    setText(statusEl, resultText);
  }

  // ============================================================
  // 12. BUTTONS AND KEYBOARD
  // ============================================================
  startBtn.addEventListener("click", enterGameFromHome);

  // NEW IN 9: the menu (Pay table, Sound, End game). It opens from the round button at the bottom right.
  const menuSheet = document.getElementById("menuSheet");
  function openMenu()  { menuSheet.classList.remove("hidden"); }
  function closeMenu() { menuSheet.classList.add("hidden"); }
  document.getElementById("menuBtn").addEventListener("click", openMenu);
  document.getElementById("menuClose").addEventListener("click", closeMenu);
  menuSheet.addEventListener("click", function (event) {
    // Tapping the dim area, or any button inside the menu, closes it. (The buttons still do their job first.)
    if (event.target === menuSheet || event.target.tagName === "BUTTON") closeMenu();
  });

  // NEW IN 9: the row of fruit under the title.
  (function buildHero() {
    const hero = document.getElementById("hero");
    ["Cherry", "Peach", "Pineapple", "Lemon", "Star", "Bell"].forEach(function (name, i) {
      const holder = document.createElement("span");
      holder.style.setProperty("--i", i);
      holder.innerHTML = fruitImgTag(name, 40);
      hero.appendChild(holder);
      holder.firstChild.style.setProperty("--i", i);
    });
  })();

  addPlayerBtn.addEventListener("click", function () {
    const names = readNames();
    if (names.length >= MAX_PLAYERS) return;
    names.push("");
    buildNameRows(names);
    nameRowsEl.querySelectorAll("input")[names.length - 1].focus();   // ready to type the new name
  });
  document.getElementById("payBtnHome").addEventListener("click", openPayTable);
  document.getElementById("payBtn").addEventListener("click", openPayTable);
  document.getElementById("payClose").addEventListener("click", closePayTable);
  ovPrimary.addEventListener("click", primaryAction);
  ovSecondary.addEventListener("click", secondaryAction);
  reshuffleBtn.addEventListener("click", tryReshuffle);

  endBtn.addEventListener("click", function () {
    // Ending in the middle of a game loses the stake, so ask first (a thumb can slip).
    if (gameState === "playing") {
      const leaving = (table.players.length > 1) ? "Leave the table now?" : "End now?";
      if (!window.confirm(leaving + " The game in progress will be forfeited.")) {
        return;
      }
    }
    endGameEarly();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (window.confirm("Clear the scoreboard and reset the jackpot to " + money(JACKPOT_START) + "?")) {
      store = { pot: JACKPOT_START, lastName: "", lastNames: [], players: {} };
      saveStore();
      renderHome();
    }
  });

  // THE PULL BUTTON. "Pointer events" cover finger, mouse and pen with the same code.
  // pointerdown = finger touches the button. pointerup = finger lifts.
  // setPointerCapture means that even if the finger slides off the button, we still hear it lift.
  pullBtn.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    pullBtn.setPointerCapture(event.pointerId);
    startCharging();
  });
  pullBtn.addEventListener("pointerup", releasePull);
  pullBtn.addEventListener("pointercancel", releasePull);
  pullBtn.addEventListener("contextmenu", function (event) { event.preventDefault(); });

  // After tapping any button, take the keyboard focus off it. Otherwise pressing SPACE or ENTER later
  // would "press" that button again by accident.
  document.addEventListener("click", function (event) {
    if (event.target.tagName === "BUTTON") {
      event.target.blur();
      if (event.target.id !== "pullBtn" && event.target.id !== "muteBtnHome" && event.target.id !== "muteBtnGame") {
        soundClick();                    // NEW IN 7: a soft tick on every button (not the pull button, which has its own sounds)
      }
    }
  });

  // NEW IN 7: switch the audio on at the first touch, click or key press (browsers insist on this).
  ["pointerup", "click", "keydown", "touchend"].forEach(function (eventName) {
    document.addEventListener(eventName, unlockAudio);
  });
  document.getElementById("muteBtnHome").addEventListener("click", toggleSound);
  document.getElementById("muteBtnGame").addEventListener("click", toggleSound);

  document.addEventListener("keydown", function (event) {
    // On the home screen the only key that matters is ENTER. We leave all other keys
    // alone so the name boxes work normally (including the space bar).
    // NEW IN 6: ENTER in a name box jumps to the next box. ENTER in the last box starts the game.
    if (gameState === "home") {
      if (event.key === "Enter" && !event.repeat && payModal.classList.contains("hidden")) {
        const boxes = Array.from(nameRowsEl.querySelectorAll("input"));
        const at = boxes.indexOf(event.target);
        if (at >= 0 && at < boxes.length - 1) {
          boxes[at + 1].focus();
        } else {
          enterGameFromHome();
        }
      }
      return;
    }

    if (event.code === "Space") {
      event.preventDefault();
      if (!event.repeat) {
        startCharging();
      }
    }
    if (event.code === "KeyR" && !event.repeat) {
      tryReshuffle();
    }
    if (event.key === "Enter" && !event.repeat) {
      primaryAction();
    }
    if (event.key === "Escape" && !event.repeat) {
      // NEW IN 6: Escape only closes the pay table now. Before, it also ended your game, which is too easy
      // to hit by accident when the phone is being passed around. Use the on-screen button to leave.
      if (!payModal.classList.contains("hidden")) {
        closePayTable();
      } else if (!menuSheet.classList.contains("hidden")) {
        closeMenu();
      }
    }
  });

  document.addEventListener("keyup", function (event) {
    if (event.code === "Space" && gameState !== "home") {
      event.preventDefault();
      releasePull();
    }
  });

  // ============================================================
  // 13. DRAWING THE BOARD (REBUILT IN 9: the modern, glossy look)
  // ============================================================
  // To keep the game smooth we paint the things that never change ONCE, into hidden spare canvases
  // ("sprites"), and then stamp them onto the board every frame. Analogy: a rubber stamp. Carving the
  // stamp takes a while, but pressing it down is instant, and we press it 50 times a frame.

  // The few colours the board uses, in one place.
  const COLOUR_TRAY    = "#2c1670";   // the dark purple tray behind the cups (shows as thin lines between neighbours)
  const COLOUR_OUTLINE = "#4b2477";   // outline of the ball, pegs and arrow

  // makeSprite carves one stamp. drawFn is given a pen and the centre point to draw around.
  function makeSprite(radius, drawFn) {
    const size = Math.ceil((radius + 3) * 2);
    const spare = document.createElement("canvas");
    spare.width  = size * RENDER_SCALE;
    spare.height = size * RENDER_SCALE;
    const pen = spare.getContext("2d");
    pen.scale(RENDER_SCALE, RENDER_SCALE);
    drawFn(pen, size / 2, size / 2);
    return { image: spare, size: size };
  }

  function stamp(sprite, x, y) {
    ctx.drawImage(sprite.image, x - sprite.size / 2, y - sprite.size / 2, sprite.size, sprite.size);
  }

  // A glossy ball, like a gumdrop or an Angry Birds bird: a radial gradient is a colour that fades outward from a
  // point. We start the bright spot off-centre, up and to the left, as if a lamp shone from there, then add a
  // small white glint on top.
  function paintShinyBall(pen, cx, cy, radius, light, mid, dark) {
    const shine = pen.createRadialGradient(cx - radius * 0.35, cy - radius * 0.4, radius * 0.1, cx, cy, radius);
    shine.addColorStop(0, light);
    shine.addColorStop(0.45, mid);
    shine.addColorStop(1, dark);
    pen.beginPath();
    pen.arc(cx, cy, radius, 0, Math.PI * 2);
    pen.fillStyle = shine;
    pen.fill();
    pen.lineWidth = 1.4;
    pen.strokeStyle = COLOUR_OUTLINE;
    pen.stroke();
    pen.beginPath();
    pen.arc(cx - radius * 0.35, cy - radius * 0.4, radius * 0.22, 0, Math.PI * 2);
    pen.fillStyle = "rgba(255, 255, 255, 0.9)";           // the little white glint
    pen.fill();
  }

  // Gold pegs (they stand out against the blue and purple glass) and a glossy red ball (it stands out from the pegs).
  const pegSprite = makeSprite(PEG_RADIUS, function (pen, cx, cy) {
    paintShinyBall(pen, cx, cy, PEG_RADIUS, "#fffbc8", "#ffd23f", "#e08a00");
  });
  const ballSprite = makeSprite(BALL_RADIUS, function (pen, cx, cy) {
    paintShinyBall(pen, cx, cy, BALL_RADIUS, "#ffc2c9", "#ff3b5c", "#b3123a");
  });

  // The backdrop: a sky-to-purple gradient, big soft clouds, and a few bubbles. Painted once.
  const backdrop = document.createElement("canvas");
  backdrop.width  = BOARD_WIDTH * RENDER_SCALE;
  backdrop.height = CANVAS_HEIGHT * RENDER_SCALE;
  (function paintBackdrop() {
    const pen = backdrop.getContext("2d");
    pen.scale(RENDER_SCALE, RENDER_SCALE);

    const glass = pen.createLinearGradient(0, 0, 0, BOARD_HEIGHT);
    glass.addColorStop(0, "#3fa9ff");
    glass.addColorStop(0.5, "#5b6cf5");
    glass.addColorStop(1, "#7d3fd8");
    pen.fillStyle = glass;
    pen.fillRect(0, 0, BOARD_WIDTH, CANVAS_HEIGHT);

    // Soft clouds: a few overlapping translucent white circles.
    pen.fillStyle = "rgba(255, 255, 255, 0.14)";
    const clouds = [[70, 60, 26], [100, 52, 32], [132, 62, 24], [300, 104, 22], [326, 96, 28], [354, 106, 20],
                    [60, 250, 18], [82, 244, 24], [330, 380, 20], [352, 372, 26], [150, 470, 18], [172, 464, 24]];
    for (const c of clouds) {
      pen.beginPath();
      pen.arc(c[0], c[1], c[2], 0, Math.PI * 2);
      pen.fill();
    }
    // A few bubbles: thin rings.
    pen.strokeStyle = "rgba(255, 255, 255, 0.28)";
    pen.lineWidth = 1.5;
    const bubbles = [[40, 30, 7], [350, 40, 9], [210, 28, 5], [24, 330, 6], [376, 470, 7], [210, 420, 5]];
    for (const b of bubbles) {
      pen.beginPath();
      pen.arc(b[0], b[1], b[2], 0, Math.PI * 2);
      pen.stroke();
    }
  })();

  function drawCups(pen) {
    const top = BOARD_HEIGHT - CUP_HEIGHT;

    // A dark tray behind the cups. It shows through as the thin outline between neighbours.
    pen.fillStyle = COLOUR_TRAY;
    pen.fillRect(0, top - 2, BOARD_WIDTH, CUP_HEIGHT + 2);

    for (const cup of cups) {
      const fruit = FRUITS[cup.fruit];
      const cupWidth = cup.right - cup.left;

      // The cup: its colour fading slightly darker toward the bottom, like a glossy candy.
      const fill = pen.createLinearGradient(0, top, 0, top + CUP_HEIGHT);
      fill.addColorStop(0, fruit.colour);
      fill.addColorStop(1, fruit.colourDeep);
      pen.fillStyle = fill;
      pen.fillRect(cup.left + 1, top, cupWidth - 2, CUP_HEIGHT);

      // a bright highlight strip down the left side: the gloss
      pen.fillStyle = "rgba(255, 255, 255, 0.35)";
      pen.fillRect(cup.left + 3, top + 3, 3, CUP_HEIGHT - 8);

      if (fruit.outline) {
        pen.strokeStyle = "#ffffff";
        pen.lineWidth = 2;
        pen.strokeRect(cup.left + 3, top + 2, cupWidth - 6, CUP_HEIGHT - 4);
      }
    }

    // White rounded dividers with a purple edge, matching the physical dividers (which are DIVIDER_WIDTH wide).
    for (let i = 1; i < cups.length; i++) {
      const x = cups[i].left;
      pen.fillStyle = COLOUR_TRAY;
      pen.fillRect(x - DIVIDER_WIDTH / 2 - 1, top, DIVIDER_WIDTH + 2, CUP_HEIGHT);
      drawCircle(pen, x, top, DIVIDER_WIDTH + 1.5, COLOUR_TRAY);
      pen.fillStyle = "#ffffff";
      pen.fillRect(x - DIVIDER_WIDTH / 2 + 0.5, top, DIVIDER_WIDTH - 1, CUP_HEIGHT);
      drawCircle(pen, x, top, DIVIDER_WIDTH - 0.5, "#ffffff");
    }

    // The fruit pictures are drawn LAST so the dividers cannot cut through them.
    // NEW IN 9: each picture is much bigger than before. A cup is only about 32 wide, so to fit big pictures we stagger them:
    // every other cup's picture sits higher, the rest lower, like bricks. Neighbours are then far enough apart
    // (sideways AND up-down) that the pictures do not collide. Each gets a soft white disc behind it so it stands out from the cup colour.
    // (The very first frames may come before a picture has loaded, so we check.)
    for (let i = 0; i < cups.length; i++) {
      const cup = cups[i];
      const picture = FRUIT_IMG[cup.fruit];
      if (!(picture.complete && picture.naturalWidth > 0)) continue;
      const cupWidth = cup.right - cup.left;
      const size = cupWidth + CUP_ICON_EXTRA;
      // keep the picture inside the board even for the cups at the very left and right
      const centreX = Math.min(BOARD_WIDTH - size / 2, Math.max(size / 2, (cup.left + cup.right) / 2));
      let centreY;
      if (CUP_ICON_STAGGER) {
        centreY = top + (i % 2 === 0 ? 0.27 : 0.73) * CUP_HEIGHT;      // alternate high and low
      } else {
        centreY = top + CUP_HEIGHT * 0.5;
      }
      drawCircle(pen, centreX, centreY, size * 0.52, "rgba(255, 255, 255, 0.55)");
      pen.drawImage(picture, centreX - size / 2, centreY - size / 2, size, size);
    }
  }

  function drawCircle(pen, x, y, radius, colour) {
    pen.beginPath();
    pen.arc(x, y, radius, 0, Math.PI * 2);
    pen.fillStyle = colour;
    pen.fill();
  }

  // The SCENE is everything that stays still between frames: the backdrop, the cups, the floor strip.
  // We paint it once into a spare canvas, and only repaint when the cups change (a reshuffle, a new game)
  // or a fruit picture finishes loading. Then every frame is a single "stamp" of the scene. It is the same
  // trick as the peg stamps, and it makes each frame several times cheaper.
  const scene = document.createElement("canvas");
  scene.width  = BOARD_WIDTH * RENDER_SCALE;
  scene.height = CANVAS_HEIGHT * RENDER_SCALE;

  function rebuildScene() {
    const pen = scene.getContext("2d");
    pen.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
    pen.drawImage(backdrop, 0, 0, BOARD_WIDTH, CANVAS_HEIGHT);
    drawCups(pen);

    // the floor strip along the bottom: purple with a bright top edge
    pen.fillStyle = COLOUR_TRAY;
    pen.fillRect(0, BOARD_HEIGHT, BOARD_WIDTH, CANVAS_HEIGHT - BOARD_HEIGHT);
    pen.fillStyle = "#ffffff";
    pen.fillRect(0, BOARD_HEIGHT, BOARD_WIDTH, 2);
    sceneDirty = false;
  }

  function draw() {
    if (sceneDirty) {
      rebuildScene();
    }
    ctx.drawImage(scene, 0, 0, BOARD_WIDTH, CANVAS_HEIGHT);        // the still scene (this also wipes the last frame)

    for (const peg of pegs) {
      stamp(pegSprite, peg.position.x, peg.position.y);
    }

    if (ball !== null) {
      // a soft shadow under the ball makes it look like it is rolling on top of the glass
      ctx.fillStyle = "rgba(20, 0, 60, 0.28)";
      ctx.beginPath();
      ctx.ellipse(ball.position.x + 2.5, ball.position.y + 4, BALL_RADIUS, BALL_RADIUS * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      stamp(ballSprite, ball.position.x, ball.position.y);
    }

    // While charging, a gold arrow at the top shows where the ball will start.
    if (charging) {
      const x = powerToX(power);
      ctx.beginPath();
      ctx.moveTo(x - 10, 6);
      ctx.lineTo(x + 10, 6);
      ctx.lineTo(x, 26);
      ctx.closePath();
      ctx.fillStyle = "#ffe03a";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.lineJoin = "round";
      ctx.strokeStyle = COLOUR_OUTLINE;
      ctx.stroke();
    }
  }

  // ============================================================
  // 14. THE GAME LOOP
  // ============================================================
  function gameLoop() {
    // On the home screen nothing is moving, so we skip the physics and drawing.
    if (gameState !== "home") {
      if (charging) {
        power = power + 1 / (CHARGE_SECONDS * 60);
        if (power >= 1) {
          power = power - 1;             // NEW IN 9: loop back to the start instead of sticking at the end
        }
        soundWhileCharging();            // CHANGED IN 9: one scale note per notch while winding up
      }

      Engine.update(engine, 1000 / 60);
      checkLanding();
      clearLandedBall();
      rescueIfStuck();

      // After a game ends, wait a moment before the overlay appears.
      if (overlayDelay > 0) {
        overlayDelay = overlayDelay - 1;
        if (overlayDelay === 0) {
          renderOverlay();
          playOutcomeSound();            // NEW IN 7: the win or lose jingle, as the result card appears
          setCelebrate(outcomeKind !== "none" && outcomeKind !== "consolation");   // CHANGED IN 9: the frame gives one happy bounce on a real win
        }
      }

      draw();
      refreshControls();
    }
    requestAnimationFrame(gameLoop);
  }

  // Get everything ready and start.
  sharpenPotCanvases();
  buildSlots();
  refreshSoundButtons();
  renderHome();
  showScreen("home");
  gameLoop();
</script>
